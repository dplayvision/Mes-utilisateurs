<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f2f2f7;
    color:#1c1c1e;
}

button,
input{
    font-family:inherit;
}

.hidden{
    display:none !important;
}

/* PIN */

.pinScreen{
    position:fixed;
    inset:0;
    background:#f2f2f7;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:9999;
    padding:20px;
}

.pinBox{
    width:100%;
    max-width:360px;
    background:white;
    border-radius:22px;
    padding:30px 22px;
    box-shadow:0 10px 35px rgba(0,0,0,.12);
    text-align:center;
}

.pinBox h1{
    margin:0 0 8px;
    font-size:28px;
}

.pinBox p{
    margin:0 0 22px;
    color:#666;
}

.pinInput{
    width:100%;
    height:55px;
    border:1px solid #d1d1d6;
    border-radius:14px;
    font-size:25px;
    text-align:center;
    letter-spacing:8px;
    outline:none;
}

.pinButton{
    width:100%;
    margin-top:15px;
    height:50px;
    border:0;
    border-radius:14px;
    background:#007aff;
    color:white;
    font-size:17px;
    font-weight:600;
}

.pinError{
    color:#ff3b30;
    margin-top:12px;
    min-height:20px;
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#007aff;
    color:white;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.headerTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

header h1{
    margin:0;
    font-size:23px;
}

.userCount{
    font-size:14px;
    opacity:.9;
}

/* CONTENT */

.container{
    max-width:800px;
    margin:auto;
    padding:15px;
}

.searchBox{
    position:relative;
    margin-bottom:15px;
}

.searchBox input{
    width:100%;
    height:48px;
    border:0;
    border-radius:14px;
    padding:0 15px 0 43px;
    font-size:16px;
    background:white;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    outline:none;
}

.searchIcon{
    position:absolute;
    left:15px;
    top:13px;
    font-size:20px;
}

/* FORM */

.formCard{
    background:white;
    border-radius:18px;
    padding:16px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.formCard h2{
    margin:0 0 15px;
    font-size:20px;
}

.formGroup{
    margin-bottom:13px;
}

.formGroup label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
}

.formGroup input,
.formGroup textarea{
    width:100%;
    border:1px solid #d1d1d6;
    border-radius:11px;
    padding:11px;
    font-size:16px;
    outline:none;
    background:white;
}

.formGroup textarea{
    min-height:80px;
    resize:vertical;
}

.inputCopy{
    display:flex;
    gap:6px;
}

.inputCopy input{
    flex:1;
    min-width:0;
}

.copyBtn{
    flex:0 0 45px;
    border:0;
    border-radius:10px;
    background:#e5e5ea;
    font-size:19px;
}

.passwordRow{
    position:relative;
}

.passwordRow input{
    padding-right:50px;
}

.eyeBtn{
    position:absolute;
    right:4px;
    top:4px;
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    font-size:19px;
}

.checkboxRow{
    display:flex;
    align-items:center;
    gap:9px;
    margin:15px 0;
}

.checkboxRow input{
    width:21px;
    height:21px;
}

.checkboxRow label{
    font-weight:600;
}

/* APPLICATION */

.applicationBox{
    background:#f2f2f7;
    border-radius:14px;
    padding:14px;
    margin:10px 0 15px;
}

.applicationBox h3{
    margin:0 0 13px;
    font-size:17px;
}

.applicationBox .formGroup:last-child{
    margin-bottom:0;
}

/* PHOTO */

.photoBox{
    border:1px dashed #aaa;
    border-radius:14px;
    padding:14px;
    text-align:center;
    margin-top:12px;
}

.photoButtons{
    display:flex;
    gap:8px;
}

.photoButtons button{
    flex:1;
    border:0;
    border-radius:11px;
    padding:12px 5px;
    background:#e5e5ea;
    font-size:14px;
}

.photoPreview{
    max-width:100%;
    max-height:220px;
    border-radius:12px;
    margin-top:12px;
}

/* MAIN BUTTONS */

.mainButtons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.mainButton{
    flex:1;
    min-width:130px;
    border:0;
    border-radius:12px;
    padding:13px 10px;
    font-size:16px;
    font-weight:600;
    background:#007aff;
    color:white;
}

.cancelButton{
    background:#8e8e93;
}

.secondaryButtons{
    display:flex;
    gap:8px;
    margin-top:10px;
}

.secondaryButtons button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:11px 7px;
    background:#e5e5ea;
    font-size:14px;
}

/* ACCESS CARD */

.accountCard{
    background:white;
    border-radius:18px;
    padding:15px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.accountHeader{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.accountName{
    font-size:19px;
    font-weight:700;
    word-break:break-word;
}

.accountActions{
    display:flex;
    gap:6px;
    flex-shrink:0;
}

.iconButton{
    width:38px;
    height:38px;
    border:0;
    border-radius:10px;
    background:#e5e5ea;
    font-size:18px;
}

.deleteButton{
    background:#ffe5e5;
}

.infoLine{
    margin-top:11px;
}

.infoLabel{
    font-size:12px;
    color:#777;
    margin-bottom:3px;
}

.infoValue{
    word-break:break-word;
}

.copyLine{
    display:flex;
    align-items:center;
    gap:6px;
}

.copyLine .value{
    flex:1;
    min-width:0;
    word-break:break-word;
}

.copySmall{
    flex:0 0 40px;
    height:35px;
    border:0;
    border-radius:9px;
    background:#e5e5ea;
    font-size:16px;
}

.urlLine{
    display:flex;
    align-items:center;
    gap:5px;
}

.urlLine a{
    flex:1;
    min-width:0;
    color:#007aff;
    text-decoration:underline;
    overflow-wrap:anywhere;
}

.safariBtn{
    flex:0 0 39px;
    height:35px;
    border:0;
    border-radius:9px;
    background:#e5e5ea;
    font-size:17px;
}

.applicationDisplay{
    background:#f2f2f7;
    border-radius:14px;
    padding:12px;
    margin-top:13px;
}

.applicationTitle{
    font-weight:700;
    margin-bottom:9px;
}

.photoDisplay{
    margin-top:12px;
}

.photoDisplay img{
    max-width:100%;
    max-height:260px;
    border-radius:12px;
}

/* EXPIRATION */

.expiration{
    margin-top:13px;
    padding:10px;
    border-radius:11px;
    background:#e8f8ed;
}

.expiration.warning{
    background:#fff3d6;
}

.expiration.danger{
    background:#ffe5e5;
}

.expiration.expired{
    background:#e5e5ea;
}

.expiration strong{
    display:block;
}

/* CALENDAR */

.calendarButton{
    width:100%;
    margin-top:10px;
    border:0;
    border-radius:11px;
    padding:10px;
    background:#e8f1ff;
    color:#007aff;
    font-weight:600;
}

/* EMPTY */

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:5000;
    padding:18px;
}

.modalBox{
    width:100%;
    max-width:500px;
    max-height:85vh;
    overflow:auto;
    background:white;
    border-radius:20px;
    padding:18px;
}

.modalBox h2{
    margin-top:0;
}

.modalButtons{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modalButtons button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:12px;
}

.closeModal{
    background:#e5e5ea;
}

/* RESPONSIVE */

@media(max-width:500px){
    .mainButtons{
        flex-direction:column;
    }

    .mainButton{
        width:100%;
    }
}
</style>
</head>

<body>

<!-- PIN -->
<div id="pinScreen" class="pinScreen">
    <div class="pinBox">
        <h1>🔐 Mes accès</h1>
        <p>Entrez votre code PIN</p>

        <input
            id="pinInput"
            class="pinInput"
            type="password"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
        >

        <button class="pinButton" onclick="checkPin()">
            Ouvrir
        </button>

        <div id="pinError" class="pinError"></div>
    </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<header>
    <div class="headerTop">
        <h1>🔐 Mes accès</h1>
        <div id="userCount" class="userCount">0 accès</div>
    </div>
</header>

<div class="container">

    <!-- SEARCH -->
    <div class="searchBox">
        <span class="searchIcon">🔎</span>
        <input
            id="searchInput"
            type="search"
            placeholder="Rechercher..."
            oninput="renderAccounts()"
        >
    </div>

    <!-- FORM -->
    <div class="formCard">

        <h2 id="formTitle">➕ Ajouter un accès</h2>

        <div class="formGroup">
            <label>Nom / Prénom</label>
            <input id="nameInput" type="text" autocomplete="off">
        </div>

        <div class="formGroup">
            <label>Utilisateur</label>
            <div class="inputCopy">
                <input id="usernameInput" type="text" autocomplete="off">
                <button class="copyBtn" onclick="copyInputValue('usernameInput')">📋</button>
            </div>
        </div>

        <div class="formGroup">
            <label>Mot de passe</label>

            <div class="passwordRow">
                <input
                    id="passwordInput"
                    type="password"
                    autocomplete="new-password"
                >

                <button
                    class="eyeBtn"
                    onclick="togglePassword('passwordInput', this)"
                >
                    👁️
                </button>
            </div>

            <button
                class="copyBtn"
                style="width:100%;height:42px;margin-top:6px;"
                onclick="copyInputValue('passwordInput')"
            >
                📋 Copier le mot de passe
            </button>
        </div>

        <div class="formGroup">
            <label>URL 1</label>

            <div class="inputCopy">
                <input id="url1Input" type="url" autocomplete="off">

                <button
                    class="copyBtn"
                    onclick="copyInputValue('url1Input')"
                >
                    📋
                </button>

                <button
                    class="copyBtn"
                    onclick="openSafari(document.getElementById('url1Input').value)"
                >
                    🌐
                </button>
            </div>
        </div>

        <div class="formGroup">
            <label>URL 2</label>

            <div class="inputCopy">
                <input id="url2Input" type="url" autocomplete="off">

                <button
                    class="copyBtn"
                    onclick="copyInputValue('url2Input')"
                >
                    📋
                </button>

                <button
                    class="copyBtn"
                    onclick="openSafari(document.getElementById('url2Input').value)"
                >
                    🌐
                </button>
            </div>
        </div>

        <!-- APPLICATION -->
        <div class="checkboxRow">

            <input
                id="isApplicationInput"
                type="checkbox"
                onchange="toggleApplicationFields()"
            >

            <label for="isApplicationInput">
                📱 Application
            </label>

        </div>

        <div id="applicationBox" class="applicationBox hidden">

            <h3>📱 Informations de l'application</h3>

            <div class="formGroup">
                <label>URL de l'application</label>

                <div class="inputCopy">

                    <input
                        id="appUrl1Input"
                        type="url"
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('appUrl1Input')"
                    >
                        📋
                    </button>

                    <button
                        class="copyBtn"
                        onclick="openSafari(document.getElementById('appUrl1Input').value)"
                    >
                        🌐
                    </button>

                </div>
            </div>

            <div class="formGroup">
                <label>MAC 1</label>

                <div class="inputCopy">

                    <input
                        id="macInput"
                        type="text"
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('macInput')"
                    >
                        📋
                    </button>

                </div>
            </div>

            <div class="formGroup">
                <label>MAC 2</label>

                <div class="inputCopy">

                    <input
                        id="mac2Input"
                        type="text"
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('mac2Input')"
                    >
                        📋
                    </button>

                </div>
            </div>

            <div class="formGroup">
                <label>Clé 1</label>

                <div class="inputCopy">

                    <input
                        id="appKeyInput"
                        type="text"
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('appKeyInput')"
                    >
                        📋
                    </button>

                </div>
            </div>

            <div class="formGroup">
                <label>Clé 2</label>

                <div class="inputCopy">

                    <input
                        id="appKey2Input"
                        type="text"
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('appKey2Input')"
                    >
                        📋
                    </button>

                </div>
            </div>

        </div>

        <!-- DUREE -->
        <div class="formGroup">

            <label>Durée en jours</label>

            <input
                id="durationInput"
                type="number"
                min="1"
                placeholder="Exemple : 353"
            >

        </div>

        <!-- PHOTO -->
        <div class="photoBox">

            <strong>📷 Document / Photo</strong>

            <div class="photoButtons">

                <button
                    onclick="document.getElementById('photoInput').click()"
                >
                    🖼️ Mes photos
                </button>

                <button
                    onclick="document.getElementById('cameraInput').click()"
                >
                    📷 Prendre une photo
                </button>

            </div>

            <input
                id="photoInput"
                type="file"
                accept="image/*"
                style="display:none"
                onchange="handlePhoto(this)"
            >

            <input
                id="cameraInput"
                type="file"
                accept="image/*"
                capture="environment"
                style="display:none"
                onchange="handlePhoto(this)"
            >

            <div id="photoPreviewContainer"></div>

        </div>

        <!-- REMARQUE -->
        <div class="formGroup" style="margin-top:13px;">

            <label>Remarque</label>

            <textarea
                id="noteInput"
                placeholder="Remarque..."
            ></textarea>

        </div>

        <div class="mainButtons">

            <button
                id="saveButton"
                class="mainButton"
                onclick="saveAccount()"
            >
                💾 Enregistrer
            </button>

            <button
                id="cancelButton"
                class="mainButton cancelButton hidden"
                onclick="cancelEdit()"
            >
                Annuler
            </button>

        </div>

        <div class="secondaryButtons">

            <button onclick="downloadBackup()">
                💾 Sauvegarde
            </button>

            <button
                onclick="document.getElementById('restoreInput').click()"
            >
                ♻️ Restaurer
            </button>

        </div>

        <input
            id="restoreInput"
            type="file"
            accept=".json,application/json"
            style="display:none"
            onchange="restoreBackup(this)"
        >

    </div>

    <!-- LISTE -->
    <div id="accountsList"></div>

</div>

</div>

<!-- PHOTO MODAL -->
<div
    id="photoModal"
    class="modal hidden"
    onclick="closePhotoModal(event)"
>

    <div
        class="modalBox"
        onclick="event.stopPropagation()"
    >

        <h2>📷 Photo</h2>

        <img
            id="modalPhoto"
            src=""
            style="width:100%;border-radius:14px;"
        >

        <div class="modalButtons">

            <button
                class="closeModal"
                onclick="document.getElementById('photoModal').classList.add('hidden')"
            >
                Fermer
            </button>

        </div>

    </div>

</div>

<script>

/* =========================
   CONFIGURATION
========================= */

const PIN = "1157";
const STORAGE_KEY = "mesAcces";

let accounts = [];
let editingId = null;
let currentPhoto = "";

/* =========================
   INITIALISATION
========================= */

document.addEventListener("DOMContentLoaded", function(){

    loadAccounts();

    document.getElementById("pinInput").focus();

    document.getElementById("pinInput").addEventListener(
        "keydown",
        function(e){

            if(e.key === "Enter"){
                checkPin();
            }

        }
    );

    updateUserCount();

    setInterval(function(){

        renderAccounts();

    }, 60000);

});

/* =========================
   PIN
========================= */

function checkPin(){

    const value =
        document.getElementById("pinInput").value;

    if(value === PIN){

        document.getElementById("pinScreen")
            .classList.add("hidden");

        document.getElementById("app")
            .classList.remove("hidden");

        renderAccounts();

    }else{

        document.getElementById("pinError")
            .textContent =
            "Code PIN incorrect";

        document.getElementById("pinInput")
            .value = "";

    }

}

/* =========================
   LOAD / SAVE
========================= */

function loadAccounts(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(Array.isArray(parsed)){

                accounts = parsed;

            }

        }

    }catch(error){

        console.error(error);

        accounts = [];

    }

}

function saveToStorage(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

}

/* =========================
   APPLICATION
========================= */

function toggleApplicationFields(){

    const checked =
        document.getElementById(
            "isApplicationInput"
        ).checked;

    const box =
        document.getElementById(
            "applicationBox"
        );

    if(checked){

        box.classList.remove("hidden");

    }else{

        box.classList.add("hidden");

    }

}

/* =========================
   PASSWORD
========================= */

function togglePassword(id, button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }

}

/* =========================
   COPY
========================= */

async function copyText(text){

    if(!text){
        return;
    }

    try{

        await navigator.clipboard.writeText(text);

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        textarea.style.position = "fixed";
        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        try{

            document.execCommand("copy");

        }catch(e){}

        document.body.removeChild(textarea);

    }

}

function copyInputValue(id){

    const input =
        document.getElementById(id);

    if(input){

        copyText(input.value);

    }

}

function copyAccountValue(value){

    copyText(value || "");

}

/* =========================
   SAFARI
========================= */

function openSafari(url){

    if(!url){
        return;
    }

    let finalUrl =
        String(url).trim();

    if(!finalUrl){
        return;
    }

    if(
        !finalUrl.startsWith("http://") &&
        !finalUrl.startsWith("https://")
    ){

        finalUrl =
            "https://" + finalUrl;

    }

    const link =
        document.createElement("a");

    link.href = finalUrl;
    link.target = "_blank";
    link.rel =
        "external noopener noreferrer";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}

/* =========================
   PHOTO
========================= */

function handlePhoto(input){

    const file =
        input.files &&
        input.files[0];

    if(!file){
        return;
    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            compressImage(
                e.target.result,
                function(compressed){

                    currentPhoto =
                        compressed;

                    showPhotoPreview();

                }
            );

        };

    reader.readAsDataURL(file);

}

function compressImage(dataUrl, callback){

    const img =
        new Image();

    img.onload =
        function(){

            const maxWidth = 1200;
            const maxHeight = 1200;

            let width = img.width;
            let height = img.height;

            if(width > maxWidth){

                height =
                    height * maxWidth / width;

                width = maxWidth;

            }

            if(height > maxHeight){

                width =
                    width * maxHeight / height;

                height = maxHeight;

            }

            const canvas =
                document.createElement("canvas");

            canvas.width = width;
            canvas.height = height;

            const ctx =
                canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                width,
                height
            );

            callback(
                canvas.toDataURL(
                    "image/jpeg",
                    0.75
                )
            );

        };

    img.src = dataUrl;

}

function showPhotoPreview(){

    const container =
        document.getElementById(
            "photoPreviewContainer"
        );

    if(!currentPhoto){

        container.innerHTML = "";

        return;

    }

    container.innerHTML = `

        <img
            class="photoPreview"
            src="${currentPhoto}"
            alt="Photo"
        >

        <button
            type="button"
            style="
                margin-top:8px;
                width:100%;
                border:0;
                border-radius:10px;
                padding:10px;
                background:#ffe5e5;
            "
            onclick="removeCurrentPhoto()"
        >
            🗑️ Supprimer la photo
        </button>

    `;

}

/* =========================

function normalizeUrl(url){

    if(!url){
        return "";
    }

    url =
        String(url).trim();

    if(
        !url.startsWith("http://") &&
        !url.startsWith("https://")
    ){

        return "https://" + url;

    }

    return url;

}

function accountUrlLine(url){

    if(!url){

        return `

        `;

    const safeUrl =
        normalizeUrl(url);

    return `

                target="_blank"
                rel="external noopener noreferrer"
            >
                ${escapeHtml(url)}

/* =========================
   ESCAPE
========================= */

function escapeHtml(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeJs(value){

    if(
        value === null ||
        value === undefined
    ){

        return "";

    }

    return String(value)
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/\r/g,"\\r")
        .replace(/\n/g,"\\n");

}

/* =========================
   DATE / DECOMPTE
========================= */

/*
   IMPORTANT :

   startDate est créé uniquement lors
   de la création d'un nouvel accès.

   Lors d'une modification, l'ancienne
   startDate est conservée.

   Le décompte est basé sur les jours
   calendaires : 353 -> 352 -> 351...
*/

function getExpirationDate(account){

    if(
        !account.startDate ||
        !account.duration
    ){

        return null;

    }

    const start =
        new Date(account.startDate);

    if(isNaN(start.getTime())){

        return null;

    }

    const expiration =
        new Date(start);

    expiration.setHours(0,0,0,0);

    expiration.setDate(
        expiration.getDate() +
        Number(account.duration)
    );

    return expiration;

}

function formatDate(date){

    if(!date){
        return "-";
    }

    return date.toLocaleDateString(
        "fr-BE",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}

function getCountdown(account){

    const expiration =
        getExpirationDate(account);

    if(!expiration){

        return null;

    }

    const now =
        new Date();

    /*
      On compare les dates sans les heures.
      Ainsi, si tu mets 353 jours aujourd'hui,
      demain sera bien 352 jours.
    */

    const today =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate()
        );

    const expirationDay =
        new Date(
            expiration.getFullYear(),
            expiration.getMonth(),
            expiration.getDate()
        );

    const diff =
        expirationDay.getTime() -
        today.getTime();

    const days =
        Math.round(
            diff /
            (1000 * 60 * 60 * 24)
        );

    return {
        days:days,
        expiration:expiration
    };

}

/* =========================
   CALENDAR GOOGLE
========================= */

function addCalendarReminder(id){

    const account =
        accounts.find(
            a => a.id === id
        );

    if(!account){

        return;

    }

    const expiration =
        getExpirationDate(account);

    if(!expiration){

        alert(
            "Impossible de calculer la date d'expiration."
        );

        return;

    }

    /*
      Rappel 2 jours avant l'expiration.
    */

    const reminder =
        new Date(expiration);

    reminder.setDate(
        reminder.getDate() - 2
    );

    /*
      Événement Google Agenda
      de 09:00 à 10:00.
    */

    const start =
        new Date(reminder);

    start.setHours(
        9,0,0,0
    );

    const end =
        new Date(reminder);

    end.setHours(
        10,0,0,0
    );

    function googleDate(date){

        const yyyy =
            date.getFullYear();

        const mm =
            String(
                date.getMonth() + 1
            ).padStart(2,"0");

        const dd =
            String(
                date.getDate()
            ).padStart(2,"0");

        const hh =
            String(
                date.getHours()
            ).padStart(2,"0");

        const mi =
            String(
                date.getMinutes()
            ).padStart(2,"0");

        const ss =
            String(
                date.getSeconds()
            ).padStart(2,"0");

        return (
            yyyy +
            mm +
            dd +
            "T" +
            hh +
            mi +
            ss
        );

    }

    const dates =
        googleDate(start) +
        "/" +
        googleDate(end);

    const title =
        encodeURIComponent(
            "Expiration accès - " +
            (account.name || "")
        );

    const details =
        encodeURIComponent(
            "Expiration prévue le " +
            formatDate(expiration)
        );

    const url =
        "https://calendar.google.com/calendar/render" +
        "?action=TEMPLATE" +
        "&text=" + title +
        "&dates=" + dates +
        "&details=" + details;

    /*
      Ouverture Google Agenda.
    */

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}

========================= */

function saveAccount(){

    const name =
        document.getElementById(
            "nameInput"
        ).value.trim();

    const username =
        document.getElementById(
            "usernameInput"
        ).value.trim();

    const password =
        document.getElementById(
            "passwordInput"
        ).value;

    const url1 =
        document.getElementById(
            "url1Input"
        ).value.trim();

    const url2 =
        document.getElementById(
            "url2Input"
        ).value.trim();

    const note =
        document.getElementById(
            "noteInput"
        ).value.trim();

    const durationValue =
        document.getElementById(
            "durationInput"
        ).value.trim();

    const isApplication =
        document.getElementById(
            "isApplicationInput"
        ).checked;

    /* APPLICATION */

    const appUrl1 =
        document.getElementById(
            "appUrl1Input"
        ).value.trim();

    const mac =
        document.getElementById(
            "macInput"
        ).value.trim();

    const mac2 =
        document.getElementById(
            "mac2Input"
        ).value.trim();

    const appKey =
        document.getElementById(
            "appKeyInput"
        ).value.trim();

    const appKey2 =
        document.getElementById(
            "appKey2Input"
        ).value.trim();

    if(!name){

        alert(
            "Veuillez mettre un Nom / Prénom."
        );

        return;

    }

    if(!durationValue){

        alert(
            "Veuillez mettre une durée en jours."
        );

        return;

    }

    /*
      On récupère l'ancien accès AVANT
      de construire le nouvel objet.
    */

    const existing =
        editingId
            ? accounts.find(
                a => a.id === editingId
            )
            : null;

    /*
      DATE DE DEPART :

      - nouvel accès :
        date d'aujourd'hui à 00:00

      - modification :
        on reprend EXACTEMENT
        l'ancienne date.

      Elle ne repart donc jamais à zéro.
    */

    let startDate;

    if(
        existing &&
        existing.startDate
    ){

        startDate =
            existing.startDate;

    }else{

        const today =
            new Date();

        today.setHours(
            0,0,0,0
        );

        startDate =
            today.toISOString();

    }

    const account = {

        ...(existing || {}),

        id:
            editingId ||
            Date.now().toString(),

        name:name,

        username:username,

        password:password,

        url1:url1,

        url2:url2,

        note:note,

        duration:
            Number(durationValue),

        /*
          NE PAS REMPLACER CETTE DATE
          lors d'une modification.
        */

        startDate:startDate,

        photo:
            currentPhoto,

        isApplication:
            isApplication,

        appUrl1:
            isApplication
                ? appUrl1
                : "",

        mac:
            isApplication
                ? mac
                : "",

        mac2:
            isApplication
                ? mac2
                : "",

        appKey:
            isApplication
                ? appKey
                : "",

        appKey2:
            isApplication
                ? appKey2
                : ""

    };

    if(editingId){

        const index =
            accounts.findIndex(
                a => a.id === editingId
            );

        if(index !== -1){

            accounts[index] =
                account;

        }

    }else{

        accounts.unshift(
            account
        );

    }

    saveToStorage();

    resetForm();

    renderAccounts();

    updateUserCount();

}

function renderAccounts(){

    const list =
        document.getElementById(
            "accountsList"
        );

    const search =
        document.getElementById(
            "searchInput"
        ).value
         .trim()
         .toLowerCase();

    /*
      Filtre d'abord.
    */

    let filtered =
        accounts.filter(
            account => {

                const applicationValues = [

                    account.appUrl1,
                    account.appUrl,
                    account.mac,
                    account.mac1,
                    account.mac2,
                    account.appKey,
                    account.key1,
                    account.appKey2,
                    account.key2

                ]
                .filter(Boolean)
                .join(" ");

                const text = [

                    account.name,
                    account.username,
                    account.password,
                    account.url1,
                    account.url2,
                    account.note,
                    applicationValues

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();

                return text.includes(search);

            }
        );

    /*
      ORDRE ALPHABÉTIQUE
      SUR NOM / PRÉNOM
    */

    filtered.sort(
        function(a,b){

            const nameA =
                String(
                    a.name || ""
                ).trim();

            const nameB =
                String(
                    b.name || ""
                ).trim();

            return nameA.localeCompare(
                nameB,
                "fr",
                {
                    sensitivity:"base"
                }
            );

        }
    );

    if(filtered.length === 0){

        list.innerHTML = `

            <div class="empty">
                Aucun accès trouvé.
            </div>

        `;

        updateUserCount(
            filtered.length
        );

        return;

    }

    list.innerHTML =
        filtered
            .map(
                account =>
                    renderAccount(account)
            )
            .join("");

    updateUserCount(
        filtered.length
    );

}

function downloadBackup(){

    const data =
        JSON.stringify(
            accounts,
            null,
            2
        );

    const blob =
        new Blob(
            [data],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    const date =
        new Date()
            .toISOString()
            .slice(0,10);

    a.href = url;

    a.download =
        "mes-acces-" +
        date +
        ".json";

    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);

    URL.revokeObjectURL(url);

}

    const file =
        input.files &&
        input.files[0];

    if(!file){

        return;

    }

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            try{

                const imported =
                    JSON.parse(
                        e.target.result
                    );

                if(
                    !Array.isArray(
                        imported
                    )
                ){

                    alert(
                        "Le fichier n'est pas valide."
                    );

                    return;

                }

                const confirmed =
                    confirm(
                        "Restaurer cette sauvegarde va remplacer les accès actuellement enregistrés. Continuer ?"
                    );

                if(!confirmed){

                    return;

                }

                accounts =
                    imported;

                saveToStorage();

                renderAccounts();

                updateUserCount();

                alert(
                    "Sauvegarde restaurée."
                );

            }catch(error){

                alert(
                    "Impossible de lire la sauvegarde."
                );

                console.error(error);

            }

        };

    reader.readAsText(file);

    input.value = "";

}

/* =========================
   SERVICE WORKER
========================= */

if(
    "serviceWorker" in navigator &&
    location.protocol === "https:"
){

    window.addEventListener(
        "load",
        function(){

            /*
              Pas de service worker obligatoire
              pour cette version.
            */

        }
    );

}

</script>
