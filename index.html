<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f2f4f7;
    color:#111;
}

.hidden{
    display:none !important;
}

header{
    background:#007aff;
    color:white;
    padding:22px 15px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

header h1{
    margin:0 0 6px;
    font-size:30px;
}

#userCount{
    font-size:32px;
    font-weight:900;
    line-height:1.1;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 12px;
    font-size:21px;
}

label{
    display:block;
    font-weight:700;
    margin:12px 0 6px;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:80px;
    resize:vertical;
}

button,
.button{
    border:0;
    border-radius:10px;
    padding:11px 14px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    text-decoration:none;
    display:inline-block;
    text-align:center;
}

.primary{
    background:#007aff;
    color:white;
}

.green{
    background:#34c759;
    color:white;
}

.red{
    background:#ff3b30;
    color:white;
}

.gray{
    background:#e5e5ea;
    color:#111;
}

.orange{
    background:#ff9500;
    color:white;
}

.purple{
    background:#af52de;
    color:white;
}

.buttonRow{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.fieldLine{
    display:flex;
    gap:7px;
    align-items:center;
}

.fieldLine input{
    flex:1;
}

.copyBtn{
    flex:0 0 auto;
    background:#e5e5ea;
    color:#111;
    padding:11px 10px;
}

.urlActions{
    display:flex;
    gap:7px;
    margin-top:7px;
}

.urlActions .button{
    flex:1;
}

.account{
    border-left:5px solid #007aff;
}

.passwordWrap{
    position:relative;
}

.passwordWrap input{
    padding-right:55px;
}

.eyeBtn{
    position:absolute;
    right:5px;
    top:5px;
    padding:8px 10px;
    background:#eee;
}

.applicationBox{
    background:#f5f5f7;
    border-radius:12px;
    padding:12px;
    margin-top:12px;
}

.countdown{
    padding:10px;
    border-radius:10px;
    margin:12px 0;
    font-weight:800;
    text-align:center;
}

.countdown.greenCount{
    background:#dff7e5;
    color:#16833a;
}

.countdown.orangeCount{
    background:#fff0d5;
    color:#a85b00;
}

.countdown.redCount{
    background:#ffe1df;
    color:#c62820;
}

.countdown.expired{
    background:#e5e5ea;
    color:#555;
}

.search{
    margin-bottom:15px;
}

.photoPreview{
    width:100%;
    max-height:220px;
    object-fit:contain;
    border-radius:12px;
    margin-top:10px;
}

.photoButtons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.photoButtons button{
    flex:1;
    min-width:140px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modalBox{
    background:white;
    width:100%;
    max-width:500px;
    border-radius:18px;
    padding:20px;
}

.modalBox h3{
    margin-top:0;
}

.copyHelp{
    font-size:15px;
    margin-bottom:12px;
    color:#444;
}

.copyFallbackInput{
    font-size:17px;
}

.login{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.loginBox{
    background:white;
    width:100%;
    max-width:380px;
    border-radius:20px;
    padding:25px;
    box-shadow:0 4px 20px rgba(0,0,0,.12);
    text-align:center;
}

.loginBox h1{
    margin-top:0;
}

.pin{
    text-align:center;
    font-size:28px;
    letter-spacing:8px;
}

.topActions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.topActions button{
    flex:1;
    min-width:130px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.small{
    font-size:13px;
    color:#666;
}

.urlText{
    font-size:14px;
}
</style>
</head>

<body>

<div id="loginScreen" class="login">
    <div class="loginBox">
        <h1>🔐 Mes accès</h1>
        <p>Entre ton code PIN</p>

        <input
            id="pinInput"
            class="pin"
            type="password"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
        >

        <br><br>

        <button class="primary" style="width:100%;" onclick="login()">
            🔓 Ouvrir
        </button>

        <p id="loginError" style="color:#ff3b30;font-weight:bold;"></p>
    </div>
</div>


<div id="app" class="hidden">

<header>
    <h1>🔐 Mes accès</h1>
    <div id="userCount">👥 0 utilisateurs</div>
</header>

<div class="container">

    <div class="topActions">
        <button class="primary" onclick="showForm()">➕ Ajouter</button>
        <button class="gray" onclick="backupData()">💾 Sauvegarde</button>
        <button class="gray" onclick="document.getElementById('restoreInput').click()">📂 Restaurer</button>
        <input
            id="restoreInput"
            type="file"
            accept=".json,application/json"
            class="hidden"
            onchange="restoreData(event)"
        >
    </div>

    <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="🔎 Rechercher..."
        oninput="renderAccounts()"
    >

    <div id="formContainer" class="card hidden">

        <h2 id="formTitle">➕ Nouvel accès</h2>

        <label>Nom / Prénom</label>
        <input id="name" type="text" placeholder="Nom et prénom">

        <label>Utilisateur</label>
        <div class="fieldLine">
            <input id="username" type="text" placeholder="Utilisateur">
            <button class="copyBtn" onclick="copyField('username',this)">📋</button>
        </div>

        <label>Mot de passe</label>
        <div class="passwordWrap">
            <input id="password" type="password" placeholder="Mot de passe">
            <button class="eyeBtn" onclick="togglePassword('password',this)">👁️</button>
        </div>
        <button class="copyBtn" style="margin-top:7px;width:100%;" onclick="copyField('password',this)">
            📋 Copier le mot de passe
        </button>

        <label>URL 1</label>
        <div class="fieldLine">
            <input id="url1" type="url" placeholder="https://...">
            <button class="copyBtn" onclick="copyField('url1',this)">📋</button>
        </div>

        <label>URL 2</label>
        <div class="fieldLine">
            <input id="url2" type="url" placeholder="https://...">
            <button class="copyBtn" onclick="copyField('url2',this)">📋</button>
        </div>

        <label>Remarque</label>
        <div class="fieldLine">
            <textarea id="note" placeholder="Remarque"></textarea>
            <button class="copyBtn" onclick="copyField('note',this)">📋</button>
        </div>

        <label>Durée</label>
        <div class="fieldLine">
            <input id="duration" type="number" min="1" value="30">
            <span>jours</span>
        </div>

        <div class="applicationBox">
            <label style="margin-top:0;">
                <input
                    id="isApplication"
                    type="checkbox"
                    style="width:auto;"
                    onchange="toggleApplicationFields()"
                >
                Application
            </label>

            <div id="applicationFields" class="hidden">

                <label>URL application</label>
                <div class="fieldLine">
                    <input id="appUrl1" type="url" placeholder="https://...">
                    <button class="copyBtn" onclick="copyField('appUrl1',this)">📋</button>
                </div>

                <label>MAC</label>
                <div class="fieldLine">
                    <input id="mac" type="text" placeholder="MAC">
                    <button class="copyBtn" onclick="copyField('mac',this)">📋</button>
                </div>

                <label>Clé</label>
                <div class="fieldLine">
                    <input id="appKey" type="text" placeholder="Clé">
                    <button class="copyBtn" onclick="copyField('appKey',this)">📋</button>
                </div>

            </div>
        </div>

        <label>Photo</label>

        <div class="photoButtons">
            <button class="gray" onclick="choosePhoto()">
                🖼️ Choisir dans les Photos
            </button>

            <button class="gray" onclick="takePhoto()">
                📷 Prendre une photo
            </button>
        </div>

        <input
            id="photoGallery"
            type="file"
            accept="image/*"
            class="hidden"
            onchange="handlePhoto(event)"
        >

        <input
            id="photoCamera"
            type="file"
            accept="image/*"
            capture="environment"
            class="hidden"
            onchange="handlePhoto(event)"
        >

        <img id="formPhotoPreview" class="photoPreview hidden">

        <div class="buttonRow">
            <button class="green" onclick="saveAccount()">💾 Enregistrer</button>
            <button class="gray" onclick="hideForm()">Annuler</button>
        </div>

    </div>

    <div id="accounts"></div>

</div>
</div>


<!-- MODALE COPIE -->
<div id="copyModal" class="modal hidden">
    <div class="modalBox">
        <h3>📋 Copier</h3>

        <div class="copyHelp">
            Si la copie automatique est bloquée par l'iPhone,
            sélectionne le texte puis choisis <b>Copier</b>.
        </div>

        <input
            id="copyFallbackInput"
            class="copyFallbackInput"
            type="text"
            readonly
            onclick="this.select()"
        >

        <div class="buttonRow">
            <button class="primary" onclick="selectFallbackText()">
                Sélectionner
            </button>

            <button class="gray" onclick="closeCopyModal()">
                Fermer
            </button>
        </div>
    </div>
</div>


<script>

const PIN = "1157";
const STORAGE_KEY = "mesAcces";

let accounts = [];
let editIndex = -1;
let currentPhoto = "";


/* =========================
   CHARGEMENT
========================= */

function loadData(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){

            const data = JSON.parse(saved);

            if(Array.isArray(data)){
                accounts = data;
            }else{
                accounts = [];
            }

        }else{
            accounts = [];
        }

    }catch(error){

        console.error(error);
        accounts = [];

    }

    renderAccounts();
    updateUserCount();
}


/* =========================
   SAUVEGARDE
========================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

    updateUserCount();
}


/* =========================
   LOGIN
========================= */

function login(){

    const pin = document.getElementById("pinInput").value;

    if(pin === PIN){

        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("app").classList.remove("hidden");

        loadData();

    }else{

        document.getElementById("loginError").textContent =
            "❌ Code incorrect";

        document.getElementById("pinInput").value = "";

    }
}

document.getElementById("pinInput").addEventListener("keydown",function(e){

    if(e.key === "Enter"){
        login();
    }

});


/* =========================
   COMPTEUR
========================= */

function updateUserCount(){

    document.getElementById("userCount").textContent =
        "👥 " + accounts.length + " utilisateurs";

}


/* =========================
   FORMULAIRE
========================= */

function showForm(index = -1){

    editIndex = index;

    document.getElementById("formContainer").classList.remove("hidden");

    if(index === -1){

        document.getElementById("formTitle").textContent =
            "➕ Nouvel accès";

        document.getElementById("name").value = "";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document.getElementById("url1").value = "";
        document.getElementById("url2").value = "";
        document.getElementById("note").value = "";
        document.getElementById("duration").value = 30;

        document.getElementById("isApplication").checked = false;

        document.getElementById("appUrl1").value = "";
        document.getElementById("mac").value = "";
        document.getElementById("appKey").value = "";

        currentPhoto = "";

        document.getElementById("formPhotoPreview").src = "";
        document.getElementById("formPhotoPreview").classList.add("hidden");

        toggleApplicationFields();

    }else{

        const a = accounts[index];

        document.getElementById("formTitle").textContent =
            "✏️ Modifier l'accès";

        document.getElementById("name").value =
            a.name || "";

        document.getElementById("username").value =
            a.username || "";

        document.getElementById("password").value =
            a.password || "";

        document.getElementById("url1").value =
            a.url1 || "";

        document.getElementById("url2").value =
            a.url2 || "";

        document.getElementById("note").value =
            a.note || "";

        document.getElementById("duration").value =
            a.duration || 30;

        document.getElementById("isApplication").checked =
            !!a.isApplication;

        document.getElementById("appUrl1").value =
            a.appUrl1 || "";

        document.getElementById("mac").value =
            a.mac || "";

        document.getElementById("appKey").value =
            a.appKey || "";

        currentPhoto = a.photo || "";

        if(currentPhoto){

            document.getElementById("formPhotoPreview").src =
                currentPhoto;

            document.getElementById("formPhotoPreview").classList.remove("hidden");

        }else{

            document.getElementById("formPhotoPreview").classList.add("hidden");

        }

        toggleApplicationFields();

    }

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function hideForm(){

    document.getElementById("formContainer").classList.add("hidden");

    editIndex = -1;
    currentPhoto = "";

}


/* =========================
   APPLICATION
========================= */

function toggleApplicationFields(){

    const checked =
        document.getElementById("isApplication").checked;

    document.getElementById("applicationFields")
        .classList.toggle("hidden",!checked);

}


/* =========================
   PHOTO
========================= */

function choosePhoto(){

    document.getElementById("photoGallery").click();

}


function takePhoto(){

    document.getElementById("photoCamera").click();

}


function handlePhoto(event){

    const file = event.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        currentPhoto = e.target.result;

        const preview =
            document.getElementById("formPhotoPreview");

        preview.src = currentPhoto;
        preview.classList.remove("hidden");

    };

    reader.readAsDataURL(file);

    event.target.value = "";

}


/* =========================
   ENREGISTREMENT
========================= */

function saveAccount(){

    const name =
        document.getElementById("name").value.trim();

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const url1 =
        document.getElementById("url1").value.trim();

    const url2 =
        document.getElementById("url2").value.trim();

    const note =
        document.getElementById("note").value.trim();

    const duration =
        parseInt(document.getElementById("duration").value) || 30;

    const isApplication =
        document.getElementById("isApplication").checked;

    const appUrl1 =
        document.getElementById("appUrl1").value.trim();

    const mac =
        document.getElementById("mac").value.trim();

    const appKey =
        document.getElementById("appKey").value.trim();


    if(!name && !username && !url1){

        alert("⚠️ Remplis au moins le nom, l'utilisateur ou une URL.");

        return;

    }


    if(editIndex === -1){

        accounts.push({

            name:name,
            username:username,
            password:password,

            /*
             * Les URL existantes sont conservées exactement
             * dans ces champs.
             */
            url1:url1,
            url2:url2,

            note:note,

            duration:duration,

            startDate:new Date().toISOString(),

            isApplication:isApplication,

            appUrl1:appUrl1,
            mac:mac,
            appKey:appKey,

            photo:currentPhoto

        });

    }else{

        const old = accounts[editIndex];

        accounts[editIndex] = {

            ...old,

            name:name,
            username:username,
            password:password,

            /*
             * On ne supprime jamais les URL existantes.
             */
            url1:url1,
            url2:url2,

            note:note,
            duration:duration,

            isApplication:isApplication,

            appUrl1:appUrl1,
            mac:mac,
            appKey:appKey,

            photo:currentPhoto

        };

    }


    saveData();

    hideForm();

    renderAccounts();

}


/* =========================
   URL
========================= */

function normalizeUrl(url){

    if(!url) return "";

    const value = url.trim();

    if(
        value.startsWith("http://") ||
        value.startsWith("https://")
    ){

        return value;

    }

    return "https://" + value;

}


function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/*
 * Les liens utilisent maintenant un vrai <a target="_blank">
 * et non window.open().
 */
function urlButtons(url){

    if(!url) return "";

    const safeUrl = normalizeUrl(url);

    return `
        <div class="urlActions">

            <a
                class="button primary"
                href="${escapeHtml(safeUrl)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                🔗 Ouvrir
            </a>

            <button
                class="button gray"
                onclick="copyText(${JSON.stringify(url)},this)"
            >
                📋 Copier
            </button>

        </div>
    `;

}


/* =========================
   AFFICHAGE
========================= */

function renderAccounts(){

    const container =
        document.getElementById("accounts");

    const search =
        document.getElementById("searchInput").value
        .toLowerCase()
        .trim();


    let filtered = accounts.filter(a => {

        const text = [

            a.name,
            a.username,
            a.url1,
            a.url2,
            a.note,
            a.appUrl1,
            a.mac,
            a.appKey

        ].join(" ").toLowerCase();

        return text.includes(search);

    });


    if(filtered.length === 0){

        container.innerHTML =
            `<div class="card empty">
                Aucun accès trouvé.
            </div>`;

        updateUserCount();

        return;

    }


    container.innerHTML = filtered.map(account => {

        const index =
            accounts.indexOf(account);

        const countdown =
            getCountdown(account);

        return `

        <div class="card account">

            <h2>
                👤 ${escapeHtml(account.name || "Sans nom")}
            </h2>

            ${countdown.html}


            ${
                account.username
                ? `
                <label>Utilisateur</label>

                <div class="fieldLine">

                    <input
                        class="urlText"
                        value="${escapeHtml(account.username)}"
                        readonly
                        onclick="this.select()"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyText(${JSON.stringify(account.username)},this)"
                    >
                        📋
                    </button>

                </div>
                `
                : ""
            }


            ${
                account.password
                ? `
                <label>Mot de passe</label>

                <div class="fieldLine">

                    <input
                        id="pass-${index}"
                        type="password"
                        value="${escapeHtml(account.password)}"
                        readonly
                    >

                    <button
                        class="copyBtn"
                        onclick="toggleAccountPassword(${index},this)"
                    >
                        👁️
                    </button>

                    <button
                        class="copyBtn"
                        onclick="copyText(${JSON.stringify(account.password)},this)"
                    >
                        📋
                    </button>

                </div>
                `
                : ""
            }


            ${
                account.url1
                ? `
                <label>URL 1</label>

                <div class="fieldLine">

                    <input
                        class="urlText"
                        value="${escapeHtml(account.url1)}"
                        readonly
                        onclick="this.select()"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyText(${JSON.stringify(account.url1)},this)"
                    >
                        📋
                    </button>

                </div>

                ${urlButtons(account.url1)}
                `
                : ""
            }


            ${
                account.url2
                ? `
                <label>URL 2</label>

                <div class="fieldLine">

                    <input
                        class="urlText"
                        value="${escapeHtml(account.url2)}"
                        readonly
                        onclick="this.select()"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyText(${JSON.stringify(account.url2)},this)"
                    >
                        📋
                    </button>

                </div>

                ${urlButtons(account.url2)}
                `
                : ""
            }


            ${
                account.note
                ? `
                <label>Remarque</label>

                <div class="fieldLine">

                    <textarea
                        readonly
                        onclick="this.select()"
                    >${escapeHtml(account.note)}</textarea>

                    <button
                        class="copyBtn"
                        onclick="copyText(${JSON.stringify(account.note)},this)"
                    >
                        📋
                    </button>

                </div>
                `
                : ""
            }


            ${
                account.isApplication
                ? `
                <div class="applicationBox">

                    <strong>📱 Application</strong>

                    ${
                        account.appUrl1
                        ? `
                        <label>URL application</label>

                        <div class="fieldLine">

                            <input
                                class="urlText"
                                value="${escapeHtml(account.appUrl1)}"
                                readonly
                                onclick="this.select()"
                            >

                            <button
                                class="copyBtn"
                                onclick="copyText(${JSON.stringify(account.appUrl1)},this)"
                            >
                                📋
                            </button>

                        </div>

                        ${urlButtons(account.appUrl1)}
                        `
                        : ""
                    }


                    ${
                        account.mac
                        ? `
                        <label>MAC</label>

                        <div class="fieldLine">

                            <input
                                value="${escapeHtml(account.mac)}"
                                readonly
                                onclick="this.select()"
                            >

                            <button
                                class="copyBtn"
                                onclick="copyText(${JSON.stringify(account.mac)},this)"
                            >
                                📋
                            </button>

                        </div>
                        `
                        : ""
                    }


                    ${
                        account.appKey
                        ? `
                        <label>Clé</label>

                        <div class="fieldLine">

                            <input
                                value="${escapeHtml(account.appKey)}"
                                readonly
                                onclick="this.select()"
                            >

                            <button
                                class="copyBtn"
                                onclick="copyText(${JSON.stringify(account.appKey)},this)"
                            >
                                📋
                            </button>

                        </div>
                        `
                        : ""
                    }

                </div>
                `
                : ""
            }


            ${
                account.photo
                ? `
                <label>Photo</label>

                <img
                    class="photoPreview"
                    src="${account.photo}"
                    alt="Photo"
                    onclick="viewPhoto(${index})"
                >
                `
                : ""
            }


            <div class="buttonRow">

                <button
                    class="primary"
                    onclick="showForm(${index})"
                >
                    ✏️ Modifier
                </button>

                <button
                    class="red"
                    onclick="deleteAccount(${index})"
                >
                    🗑️ Supprimer
                </button>

                <a
                    class="button orange"
                    target="_blank"
                    rel="noopener noreferrer"
                    href="${googleCalendarUrl(account)}"
                >
                    📅 Google Calendar
                </a>

            </div>

        </div>

        `;

    }).join("");

    updateUserCount();

}


/* =========================
   COMPTE À REBOURS
========================= */

function getCountdown(account){

    const duration =
        Number(account.duration || 30);

    const start =
        account.startDate
        ? new Date(account.startDate)
        : new Date();

    const expiry =
        new Date(start);

    expiry.setDate(
        expiry.getDate() + duration
    );

    const now =
        new Date();

    const difference =
        expiry.getTime() - now.getTime();

    const days =
        Math.ceil(
            difference / (1000 * 60 * 60 * 24)
        );


    let css = "";
    let text = "";

    if(days < 0){

        css = "expired";

        text =
            "❌ Expiré depuis " +
            Math.abs(days) +
            " jour(s)";

    }else if(days <= 2){

        css = "redCount";

        text =
            "⚠️ Expire dans " +
            days +
            " jour(s)";

    }else if(days <= 7){

        css = "orangeCount";

        text =
            "🟠 Expire dans " +
            days +
            " jours";

    }else{

        css = "greenCount";

        text =
            "🟢 Expire dans " +
            days +
            " jours";

    }


    const expiration =
        expiry.toLocaleDateString(
            "fr-BE",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );


    return {

        html:`
            <div class="countdown ${css}">
                ${text}<br>
                <span class="small">
                    Durée : ${duration} jour(s)
                    · Expiration : ${expiration}
                </span>
            </div>
        `,

        expiry:expiry

    };

}


/* =========================
   GOOGLE CALENDAR
========================= */

function googleCalendarUrl(account){

    const result =
        getCountdown(account);

    const expiry =
        result.expiry;

    const reminder =
        new Date(expiry);

    reminder.setDate(
        reminder.getDate() - 2
    );


    function formatDate(date){

        return date.toISOString()
            .replace(/[-:]/g,"")
            .split(".")[0] + "Z";

    }


    const start =
        formatDate(reminder);

    const endDate =
        new Date(reminder);

    endDate.setHours(
        endDate.getHours() + 1
    );

    const end =
        formatDate(endDate);


    const title =
        "🔔 Rappel accès : " +
        (account.name || "Accès");


    const details =
        "L'accès expire le " +
        expiry.toLocaleDateString("fr-BE") +
        ".";


    return (
        "https://calendar.google.com/calendar/render" +
        "?action=TEMPLATE" +
        "&text=" + encodeURIComponent(title) +
        "&dates=" + start + "/" + end +
        "&details=" + encodeURIComponent(details)
    );

}


/* =========================
   COPIE
========================= */

/*
 * Nouvelle méthode :
 * - Clipboard API moderne
 * - pas de execCommand()
 * - pas de textarea caché
 * - si iPhone bloque la copie automatique,
 *   ouverture d'une zone visible permettant
 *   d'utiliser le bouton Copier natif de l'iPhone.
 */

function copyText(text,button){

    if(text === null || text === undefined || text === ""){
        return;
    }

    const value =
        String(text);


    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard.writeText(value)
            .then(function(){

                copiedButton(button);

            })
            .catch(function(){

                showCopyFallback(value);

            });

    }else{

        showCopyFallback(value);

    }

}


function copiedButton(button){

    if(!button) return;

    const original =
        button.textContent;

    button.textContent =
        "✅ Copié !";

    button.disabled = true;

    setTimeout(function(){

        button.textContent =
            original;

        button.disabled = false;

    },1200);

}


function showCopyFallback(text){

    const modal =
        document.getElementById("copyModal");

    const input =
        document.getElementById("copyFallbackInput");

    input.value =
        text;

    modal.classList.remove("hidden");

    setTimeout(function(){

        input.focus();
        input.select();

        try{
            input.setSelectionRange(
                0,
                input.value.length
            );
        }catch(e){}

    },100);

}


function selectFallbackText(){

    const input =
        document.getElementById("copyFallbackInput");

    input.focus();
    input.select();

    try{
        input.setSelectionRange(
            0,
            input.value.length
        );
    }catch(e){}

}


function closeCopyModal(){

    document
        .getElementById("copyModal")
        .classList.add("hidden");

}


function copyField(id,button){

    const field =
        document.getElementById(id);

    if(!field) return;

    copyText(
        field.value,
        button
    );

}

function togglePassword(id,button){

        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";
        button.textContent = "🙈";

    }else{

        input.type = "password";
        button.textContent = "👁️";

    }

}

}


/* =========================
   SUPPRESSION
========================= */

function deleteAccount(index){

    const account =
        accounts[index];

    if(!account) return;

    const ok =
        confirm(
            "Supprimer l'accès « " +
            (account.name || "Sans nom") +
            " » ?"
        );

    if(!ok) return;

    accounts.splice(index,1);

    saveData();

    renderAccounts();

}


/* =========================
   PHOTO AGRANDIE
========================= */

function viewPhoto(index){

    const account =
        accounts[index];

    if(!account || !account.photo) return;

    const modal =
        document.createElement("div");

    modal.className =
        "modal";

    modal.innerHTML = `

        <div class="modalBox">

            <img
                src="${account.photo}"
                style="
                    width:100%;
                    max-height:70vh;
                    object-fit:contain;
                    border-radius:12px;
                "
            >

            <br><br>

            <button
                class="gray"
                style="width:100%;"
                onclick="this.closest('.modal').remove()"
            >
                Fermer
            </button>

        </div>

    `;

    document.body.appendChild(modal);

}


/* =========================
   SAUVEGARDE JSON
========================= */

function backupData(){

    const data =
        JSON.stringify(
            accounts,
            null,
            2
        );

    const blob =
        new Blob(
            [data],
            {
                type:"application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "mes-acces-sauvegarde.json";

    document.body.appendChild(a);

    a.click();

    a.remove();

    URL.revokeObjectURL(url);

}


/* =========================
   RESTAURATION
========================= */

function restoreData(event){

    const file =
        event.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload =
        function(e){

            try{

                const data =
                    JSON.parse(e.target.result);

                if(!Array.isArray(data)){

                    alert(
                        "❌ Fichier de sauvegarde invalide."
                    );

                    return;

                }


                const ok =
                    confirm(
                        "Restaurer cette sauvegarde ?\n\n" +
                        "Les données actuellement enregistrées " +
                        "seront remplacées."
                    );

                if(!ok) return;


                accounts =
                    data;

                saveData();

                renderAccounts();

                alert(
                    "✅ Sauvegarde restaurée."
                );

            }catch(error){

                alert(
                    "❌ Impossible de lire la sauvegarde."
                );

            }

        };

    reader.readAsText(file);

    event.target.value = "";

}
