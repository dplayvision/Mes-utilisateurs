<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f2f2f7;
    color:#111;
}

header{
    background:#007aff;
    color:white;
    padding:18px 15px 16px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:20;
}

header h1{
    margin:0 0 10px;
    font-size:25px;
}

.userCount{
    font-size:32px;
    font-weight:900;
    line-height:1.15;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.card,
.account{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input,
textarea{
    width:100%;
    border:1px solid #d1d1d6;
    border-radius:10px;
    padding:12px;
    font-size:16px;
    background:#fff;
    margin-top:6px;
}

textarea{
    min-height:80px;
    resize:vertical;
}

label{
    display:block;
    font-weight:600;
    margin-top:12px;
}

button{
    border:0;
    border-radius:10px;
    padding:11px 14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.primary{
    background:#007aff;
    color:white;
    width:100%;
    margin-top:15px;
}

.secondary{
    background:#e5e5ea;
    color:#111;
}

.danger{
    background:#ff3b30;
    color:white;
}

.copyBtn{
    background:#e5e5ea;
    color:#111;
    padding:8px 10px;
    font-size:13px;
    margin-left:6px;
    white-space:nowrap;
}

.copyBtn.copied{
    background:#34c759;
    color:white;
}

.fieldRow{
    display:flex;
    align-items:center;
    gap:5px;
}

.fieldRow input{
    flex:1;
}

.urlLink{
    display:inline-block;
    color:#007aff;
    text-decoration:underline;
    word-break:break-all;
    margin-top:6px;
    margin-right:5px;
}

.hidden{
    display:none !important;
}

.checkRow{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:15px;
}

.checkRow input{
    width:auto;
    margin:0;
}

.countdown{
    margin:12px 0;
    padding:14px;
    border-radius:12px;
    font-weight:800;
    text-align:center;
    font-size:17px;
}

.countdown.ok{
    background:#e8f8ed;
    color:#16803c;
}

.countdown.warning{
    background:#fff3cd;
    color:#9a6700;
}

.countdown.danger{
    background:#ffe5e5;
    color:#c62828;
}

.countdown.expired{
    background:#e5e5ea;
    color:#555;
}

.countdown.none{
    background:#f2f2f7;
    color:#777;
}

.login{
    position:fixed;
    inset:0;
    background:#f2f2f7;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.loginBox{
    background:white;
    width:100%;
    max-width:360px;
    border-radius:20px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.15);
    text-align:center;
}

.loginBox h1{
    margin-top:0;
}

.loginError{
    color:#ff3b30;
    font-weight:600;
    margin-top:10px;
}

.topButtons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.topButtons button{
    flex:1;
    min-width:130px;
}

.photoPreview{
    width:100%;
    max-height:250px;
    object-fit:contain;
    border-radius:12px;
    margin-top:10px;
    background:#f2f2f7;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

hr{
    border:0;
    border-top:1px solid #e5e5ea;
    margin:18px 0;
}

.account h2{
    margin:0 0 12px;
    font-size:20px;
}

.accountLine{
    margin:9px 0;
    word-break:break-word;
}

.accountLabel{
    font-size:13px;
    color:#666;
    font-weight:600;
}

.accountValue{
    margin-top:3px;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
}

.actions button{
    flex:1;
    min-width:100px;
}

.durationBox{
    background:#f2f2f7;
    border-radius:14px;
    padding:14px;
    margin-top:12px;
}

.durationBoxTitle{
    font-weight:800;
    font-size:16px;
    margin-bottom:8px;
}

.durationRow{
    display:flex;
    align-items:center;
    gap:8px;
}

.durationRow input{
    margin:0;
    flex:1;
}

.durationUnit{
    font-weight:700;
    white-space:nowrap;
}

.dateInfo{
    margin-top:8px;
    font-size:14px;
    color:#555;
}

.calendarBox{
    margin-top:10px;
    padding:12px;
    border-radius:12px;
    background:#eef6ff;
    color:#075ca8;
}

.calendarButton{
    background:#007aff;
    color:white;
    width:100%;
    margin-top:8px;
}

.photoButtons{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.photoButtons button{
    flex:1;
}

.photoButtonText{
    display:block;
    margin-top:8px;
    color:#666;
    font-size:14px;
}

.openUrlButton{
    background:#007aff;
    color:white;
    padding:8px 10px;
    font-size:13px;
    margin-left:4px;
}

</style>
</head>

<body>

<div class="login" id="loginScreen">

    <div class="loginBox">

        <h1>🔐 Mes accès</h1>

        <p>Entrez votre code PIN</p>

        <input
            type="password"
            id="pinInput"
            inputmode="numeric"
            maxlength="4"
            placeholder="PIN"
            autocomplete="off"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Se connecter
        </button>

        <div
            id="loginError"
            class="loginError hidden"
        >
            Code incorrect
        </div>

    </div>

</div>


<header>

    <h1>🔐 Mes accès</h1>

    <div
        class="userCount"
        id="userCount"
    >
        👥 0 utilisateurs
    </div>

</header>


<div class="container">

    <div class="topButtons">

        <button
            class="secondary"
            onclick="showAddForm()"
        >
            ➕ Ajouter
        </button>

        <button
            class="secondary"
            onclick="exportData()"
        >
            💾 Sauvegarder
        </button>

        <button
            class="secondary"
            onclick="document.getElementById('importFile').click()"
        >
            📂 Restaurer
        </button>

        <input
            type="file"
            id="importFile"
            accept=".json,application/json"
            class="hidden"
            onchange="importData(event)"
        >

    </div>


    <input
        id="searchInput"
        placeholder="🔎 Rechercher un utilisateur..."
        oninput="renderAccounts()"
    >


    <div
        class="card hidden"
        id="formCard"
    >

        <h2 id="formTitle">
            ➕ Nouvel accès
        </h2>


        <label>
            Nom / Prénom
        </label>

        <input
            id="name"
            placeholder="Exemple : Jean Dupont"
        >


        <label>
            Utilisateur
        </label>

        <div class="fieldRow">

            <input
                id="username"
                placeholder="Utilisateur"
            >

            <button
                type="button"
                class="copyBtn"
                onclick="copyField('username',this)"
            >
                📋 Copier
            </button>

        </div>


        <label>
            Mot de passe
        </label>

        <div class="fieldRow">

            <input
                id="password"
                type="password"
                placeholder="Mot de passe"
            >

            <button
                type="button"
                class="copyBtn"
                onclick="togglePassword()"
            >
                👁️
            </button>

            <button
                type="button"
                class="copyBtn"
                onclick="copyField('password',this)"
            >
                📋 Copier
            </button>

        </div>


        <label>
            URL 1
        </label>

        <div class="fieldRow">

            <input
                id="url1"
                placeholder="https://..."
            >

            <button
                type="button"
                class="copyBtn"
                onclick="copyField('url1',this)"
            >
                📋 Copier
            </button>

        </div>


        <label>
            URL 2
        </label>

        <div class="fieldRow">

            <input
                id="url2"
                placeholder="https://..."
            >

            <button
                type="button"
                class="copyBtn"
                onclick="copyField('url2',this)"
            >
                📋 Copier
            </button>

        </div>


        <label>
            Remarque
        </label>

        <textarea
            id="remark"
            placeholder="Remarque..."
        ></textarea>


        <hr>


        <div class="durationBox">

            <div class="durationBoxTitle">
                ⏳ Durée de l'accès
            </div>

            <div class="durationRow">

                <input
                    id="duration"
                    type="number"
                    min="1"
                    step="1"
                    inputmode="numeric"
                    placeholder="Exemple : 365"
                >

                <span class="durationUnit">
                    jours
                </span>

            </div>

            <div
                class="dateInfo"
                id="startDateInfo"
            >
                📅 La date de début sera enregistrée à l'ajout.
            </div>

            <div
                class="dateInfo"
                id="expiryPreview"
            >
                📅 La date d'expiration sera calculée automatiquement.
            </div>

        </div>


        <div class="checkRow">

            <input
                type="checkbox"
                id="isApplication"
                onchange="toggleApplicationFields()"
            >

            <label
                for="isApplication"
                style="margin:0;"
            >
                📱 Application
            </label>

        </div>


        <div
            id="applicationFields"
            class="hidden"
        >

            <label>
                URL de l'application
            </label>

            <div class="fieldRow">

                <input
                    id="appUrl1"
                    placeholder="https://..."
                >

                <button
                    type="button"
                    class="copyBtn"
                    onclick="copyField('appUrl1',this)"
                >
                    📋 Copier
                </button>

            </div>


            <label>
                MAC
            </label>

            <div class="fieldRow">

                <input
                    id="mac"
                    placeholder="MAC"
                >

                <button
                    type="button"
                    class="copyBtn"
                    onclick="copyField('mac',this)"
                >
                    📋 Copier
                </button>

            </div>


            <label>
                Clé
            </label>

            <div class="fieldRow">

                <input
                    id="appKey"
                    placeholder="Clé"
                >

                <button
                    type="button"
                    class="copyBtn"
                    onclick="copyField('appKey',this)"
                >
                    📋 Copier
                </button>

            </div>

        </div>


        <hr>


        <label>
            📷 Photo
        </label>


        <div class="photoButtons">

            <button
                type="button"
                class="secondary"
                onclick="choosePhoto()"
            >
                🖼️ Choisir dans les Photos
            </button>


            <button
                type="button"
                class="secondary"
                onclick="takePhoto()"
            >
                📷 Prendre une photo
            </button>

        </div>


        <input
            type="file"
            id="photoLibraryInput"
            accept="image/*"
            class="hidden"
            onchange="handlePhoto(event)"
        >


        <input
            type="file"
            id="cameraInput"
            accept="image/*"
            capture="environment"
            class="hidden"
            onchange="handlePhoto(event)"
        >


        <span class="photoButtonText">
            Choisis une photo existante ou prends-en une nouvelle.
        </span>


        <div
            id="photoContainer"
            class="hidden"
        >

            <img
                id="photoPreview"
                class="photoPreview"
            >

            <button
                type="button"
                class="danger"
                style="width:100%;margin-top:8px;"
                onclick="removePhoto()"
            >
                🗑️ Supprimer la photo
            </button>

        </div>


        <button
            type="button"
            class="primary"
            onclick="saveAccount()"
        >
            💾 Enregistrer
        </button>


        <button
            type="button"
            class="secondary"
            style="width:100%;margin-top:8px;"
            onclick="cancelForm()"
        >
            Annuler
        </button>

    </div>


    <div id="accountsList"></div>

</div>


<script>

const PIN = "1157";

const STORAGE_KEY = "mesAcces";

let accounts = [];

let editIndex = -1;

let currentPhoto = "";


/* =========================
   CHARGEMENT
========================= */

function loadData(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(saved){

            accounts =
                JSON.parse(saved);

            if(!Array.isArray(accounts)){

                accounts = [];

            }

        }else{

            accounts = [];

        }

    }catch(error){

        console.error(error);

        accounts = [];

    }

    updateUserCount();

    renderAccounts();

}


/* =========================
   SAUVEGARDE
========================= */

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(accounts)
        );

    }catch(error){

        alert(
            "Impossible de sauvegarder les données. Le stockage est peut-être plein."
        );

        console.error(error);

    }

}


/* =========================
   CONNEXION
========================= */

function login(){

    const pin =
        document
            .getElementById("pinInput")
            .value;

    if(pin === PIN){

        document
            .getElementById("loginScreen")
            .classList
            .add("hidden");

        document
            .getElementById("loginError")
            .classList
            .add("hidden");

        loadData();

    }else{

        document
            .getElementById("loginError")
            .classList
            .remove("hidden");

        document
            .getElementById("pinInput")
            .value = "";

        document
            .getElementById("pinInput")
            .focus();

    }

}


document
    .getElementById("pinInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                login();

            }

        }
    );


/* =========================
   COMPTEUR
========================= */

function updateUserCount(){

    const count =
        accounts.length;

    document
        .getElementById("userCount")
        .textContent =
            "👥 " +
            count +
            " utilisateur" +
            (
                count > 1
                    ? "s"
                    : ""
            );

}


/* =========================
   FORMULAIRE
========================= */

function showAddForm(){

    editIndex = -1;

    document
        .getElementById("formTitle")
        .textContent =
            "➕ Nouvel accès";

    clearForm();

    document
        .getElementById("formCard")
        .classList
        .remove("hidden");

    updateDatePreview();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function clearForm(){

    document.getElementById("name").value = "";

    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("url1").value = "";

    document.getElementById("url2").value = "";

    document.getElementById("remark").value = "";

    document.getElementById("duration").value = "";


    document
        .getElementById("isApplication")
        .checked = false;


    document.getElementById("appUrl1").value = "";

    document.getElementById("mac").value = "";

    document.getElementById("appKey").value = "";


    document
        .getElementById("applicationFields")
        .classList
        .add("hidden");


    currentPhoto = "";


    document
        .getElementById("photoLibraryInput")
        .value = "";

    document
        .getElementById("cameraInput")
        .value = "";


    document
        .getElementById("photoContainer")
        .classList
        .add("hidden");


    document
        .getElementById("photoPreview")
        .removeAttribute("src");


    document
        .getElementById("startDateInfo")
        .textContent =
            "📅 La date de début sera enregistrée à l'ajout.";


    document
        .getElementById("expiryPreview")
        .textContent =
            "📅 La date d'expiration sera calculée automatiquement.";

}


function cancelForm(){

    document
        .getElementById("formCard")
        .classList
        .add("hidden");

    editIndex = -1;

    clearForm();

}


function toggleApplicationFields(){

    const checked =
        document
            .getElementById("isApplication")
            .checked;

    document
        .getElementById("applicationFields")
        .classList
        .toggle(
            "hidden",
            !checked
        );

}


/* =========================
   MOT DE PASSE
========================= */

function togglePassword(){

    const field =
        document
            .getElementById("password");

    if(field.type === "password"){

        field.type = "text";

    }else{

        field.type = "password";

    }

}


/* =========================
   COPIER - IPHONE
========================= */

function copyField(id, button){

    const field =
        document.getElementById(id);

    if(!field){

        return;

    }

    copyText(
        field.value,
        button
    );

}


function copyText(text, button){

    if(
        text === null ||
        text === undefined ||
        String(text) === ""
    ){

        alert("Rien à copier.");

        return;

    }


    const value =
        String(text);


    /*
       Méthode très compatible iPhone :
       on sélectionne temporairement
       le texte dans un textarea caché.
    */

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        value;


    textarea.setAttribute(
        "readonly",
        ""
    );


    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.style.top =
        "0";

    textarea.style.opacity =
        "0";

    textarea.style.fontSize =
        "16px";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    textarea.setSelectionRange(
        0,
        textarea.value.length
    );


    let success = false;


    try{

        success =
            document.execCommand(
                "copy"
            );

    }catch(error){

        success = false;

    }


    document.body.removeChild(
        textarea
    );


    if(success){

        if(button){

            const oldText =
                button.innerHTML;


            button.innerHTML =
                "✅ Copié !";


            button.classList.add(
                "copied"
            );


            setTimeout(
                function(){

                    button.innerHTML =
                        "📋 Copier";

                    button.classList.remove(
                        "copied"
                    );

                },
                1500
            );

        }else{

            alert(
                "📋 Copié !"
            );

        }

    }else{

        /*
           Dernière solution :
           affichage du texte pour
           permettre le copier-coller
           manuel sur iPhone.
        */

        prompt(
            "📋 Copiez ce texte :",
            value
        );

    }

}


/* =========================
   PHOTO
========================= */

function choosePhoto(){

    document
        .getElementById(
            "photoLibraryInput"
        )
        .click();

}


function takePhoto(){

    document
        .getElementById(
            "cameraInput"
        )
        .click();

}


function handlePhoto(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "Veuillez sélectionner une image."
        );

        event.target.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            currentPhoto =
                e.target.result;


            document
                .getElementById(
                    "photoPreview"
                )
                .src =
                    currentPhoto;


            document
                .getElementById(
                    "photoContainer"
                )
                .classList
                .remove(
                    "hidden"
                );

        };


    reader.onerror =
        function(){

            alert(
                "Impossible de lire la photo."
            );

        };


    reader.readAsDataURL(
        file
    );

}


function removePhoto(){

    currentPhoto = "";


    document
        .getElementById(
            "photoLibraryInput"
        )
        .value = "";


    document
        .getElementById(
            "cameraInput"
        )
        .value = "";


    document
        .getElementById(
            "photoPreview"
        )
        .removeAttribute(
            "src"
        );


    document
        .getElementById(
            "photoContainer"
        )
        .classList
        .add(
            "hidden"
        );

}


/* =========================
   DATES
========================= */

function calculateExpiryDate(
    startDate,
    duration
){

    if(
        !startDate ||
        !duration
    ){

        return null;

    }


    const start =
        new Date(
            startDate
        );


    if(
        isNaN(
            start.getTime()
        )
    ){

        return null;

    }


    start.setHours(
        0,
        0,
        0,
        0
    );


    const expiry =
        new Date(
            start
        );


    expiry.setDate(
        expiry.getDate() +
        Number(duration)
    );


    return expiry;

}


function formatDate(date){

    if(!date){

        return "";

    }


    return date.toLocaleDateString(
        "fr-BE"
    );

}


/* =========================
   APERÇU DATE
========================= */

function updateDatePreview(){

    const durationValue =
        document
            .getElementById(
                "duration"
            )
            .value
            .trim();


    const duration =
        parseInt(
            durationValue,
            10
        );


    const startInfo =
        document.getElementById(
            "startDateInfo"
        );


    const expiryInfo =
        document.getElementById(
            "expiryPreview"
        );


    if(
        !Number.isInteger(
            duration
        ) ||
        duration < 1
    ){

        if(editIndex === -1){

            startInfo.textContent =
                "📅 La date de début sera enregistrée à l'ajout.";

        }


        expiryInfo.textContent =
            "📅 La date d'expiration sera calculée automatiquement.";

        return;

    }


    let startDate;


    if(editIndex === -1){

        startDate =
            new Date();

        startInfo.textContent =
            "📅 Début : aujourd'hui";

    }else{

        const account =
            accounts[editIndex];


        if(
            account &&
            account.startDate &&
            !isNaN(
                new Date(
                    account.startDate
                ).getTime()
            )
        ){

            startDate =
                new Date(
                    account.startDate
                );

            startInfo.textContent =
                "📅 Début conservé : " +
                formatDate(
                    startDate
                );

        }else{

            startDate =
                new Date();

            startInfo.textContent =
                "📅 Début : aujourd'hui";

        }

    }


    const expiry =
        calculateExpiryDate(
            startDate,
            duration
        );


    expiryInfo.textContent =
        "📅 Expiration : " +
        formatDate(

function saveAccount(){

            .getElementById(
                "username"
            )

            )
            .value;

            .getElementById(
                "url1"
            )
            .value

    const url2 =

            .getElementById(
                "url2"
            )
            .value
            .trim();


    const remark =
        document
            .getElementById(
                "remark"
            )
            .value
            .trim();


    const durationValue =
        document
            .getElementById(

            )
            .value

                durationValue,

            )
            .value

    if(!name){

        );

    if(
        durationValue &&
        (
            !Number.isInteger(
                duration
            ) ||
            duration < 1

    ){

        alert(
            "La durée doit être un nombre entier supérieur à 0."
        );

        return;

    }


    if(editIndex === -1){

        accounts.push({

            name:name,

            username:username,

            password:password,

            url1:url1,

            url2:url2,

            remark:remark,

            duration:duration,

                new Date().toISOString(),

                isApplication,

            remark;

            isNaN(
                new Date(

                new Date().toISOString();

        }


        account.isApplication =
            isApplication;

        account.appUrl1 =
            appUrl1;

        account.mac =
            mac;

        account.appKey =
            appKey;

        account.photo =
            currentPhoto;

    }


    saveData();

    updateUserCount();

    renderAccounts();

    cancelForm();

/* =========================
   COMPTE À REBOURS
========================= */

function getCountdown(account){

    if(
        !account.duration ||
        !account.startDate
    ){

        return {

            text:
                "⏳ Aucune durée définie",

            className:
                "none",

            days:null

        };

    }


    const start =
        new Date(
            account.startDate
        );


    if(
        isNaN(
            start.getTime()
        )
    ){

        return {

            text:
                "⏳ Date de départ invalide",

            className:
                "none",

            days:null

        };

    }


    start.setHours(
        0,
        0,
        0,
        0
    );


    const expiry =
        new Date(
            start
        );


    expiry.setDate(
        expiry.getDate() +
        Number(
            account.duration
        )
    );


    const today =
        new Date();


    today.setHours(
        0,
        0,
        0,
        0
    );


    const difference =
        Math.ceil(
            (
                expiry -
                today
            ) /
            (
                1000 *
                60 *
                60 *
                24
            )
        );


    if(difference < 0){

        const days =
            Math.abs(
                difference
            );


        return {

            text:
                "❌ Expiré depuis " +
                days +
                " jour" +
                (
                    days > 1
                        ? "s"
                        : ""
                ),

            className:
                "expired",

            days:
                difference

        };

    }


    if(difference === 0){

        return {

            text:
                "⚠️ Expire aujourd'hui",

            className:
                "danger",

            days:0

        };

    }


    if(difference === 1){

        return {

            text:
                "🔴 1 jour restant",

            className:
                "danger",

            days:1

        };

    }


    if(difference === 2){

        return {

            text:
                "🔴 2 jours restants",

            className:
                "danger",

            days:2

        };

    }


    if(difference <= 7){

        return {

            text:
                "🟠 " +
                difference +
                " jours restants",

            className:
                "warning",

            days:
                difference

        };

    }


    return {

        text:
            "🟢 " +
            difference +
            " jours restants",

        className:
            "ok",

        days:
            difference

    };

}


/* =========================
   DATE EXPIRATION
========================= */

function getExpirationDate(account){

    const expiry =
        calculateExpiryDate(
            account.startDate,
            account.duration
        );


    if(!expiry){

        return "";

    }


    return formatDate(
        expiry
    );

}


/* =========================
   GOOGLE CALENDAR
========================= */

function googleDate(date){

    return (
        date.getFullYear() +
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        )
    );

}


function addToGoogleCalendar(index){

    const account =
        accounts[index];


    if(!account){

        return;

    }


    const expiry =
        calculateExpiryDate(
            account.startDate,
            account.duration
        );


    if(!expiry){

        alert(
            "Il faut d'abord définir une durée."
        );

        return;

    }


    const reminder =
        new Date(
            expiry
        );


    reminder.setDate(
        reminder.getDate() -
        2
    );


    const start =
        googleDate(
            reminder
        );


    const endDate =
        new Date(
            reminder
        );


    endDate.setDate(
        endDate.getDate() +
        1
    );


    const end =
        googleDate(
            endDate
        );


    const title =
        "📧 Rappel accès - " +
        (
            account.name ||
            "Utilisateur"
        );


    const details =
        "Rappel concernant l'accès." +
        "\nDate du rappel : " +
        formatDate(
            reminder
        ) +
        "\nDate d'expiration : " +
        formatDate(
            expiry
        );


    const url =
        "https://calendar.google.com/calendar/render" +
        "?action=TEMPLATE" +
        "&text=" +
        encodeURIComponent(
            title
        ) +
        "&dates=" +
        start +
        "/" +
        end +
        "&details=" +
        encodeURIComponent(
            details
        );


    window.open(
        url,
        "_blank"
    );

}


/* =========================
   URL - NOUVEL ONGLET
========================= */

function normalizeUrl(url){

    if(!url){

        return "";

    }


    const value =
        url.trim();


    if(
        /^https?:\/\//i.test(
            value
        )
    ){

        return value;

    }


    return "https://" +
        value;

}


function openUrl(url){

    if(!url){

        return;

    }


    const normalized =
        normalizeUrl(
            url
        );


    window.open(
        normalized,
        "_blank"
    );

}


function createUrlLink(url){

    if(!url){

        return "";

    }


    return (
        '<button ' +
        'type="button" ' +
        'class="openUrlButton" ' +
        'onclick="openUrl(' +
        jsString(url) +
        ')">' +
        '🔗 Ouvrir' +
        '</button>'
    );

}

function toggleDisplayedPassword(index){

            "pass-" +

    }

        element.textContent ===

    }

}


/* =========================
   SÉCURITÉ HTML
========================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function jsString(value){

    return JSON
        .stringify(
            String(
                value ||
                ""
            )
        )
        .replace(
            /</g,
            "\\u003c"
        );

}


/* =========================
   EXPORT
========================= */

function exportData(){

    const data =
        JSON.stringify(
            accounts,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        "mes-acces-sauvegarde.json";


    document.body.appendChild(
        a
    );


    a.click();


    document.body.removeChild(
        a
    );


    URL.revokeObjectURL(
        url
    );

}


/* =========================
   IMPORT
========================= */

function importData(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if(
                    !Array.isArray(
                        imported
                    )
                ){

                    alert(
                        "Fichier de sauvegarde invalide."
                    );

                    return;

                }


                if(
                    !confirm(
                        "Remplacer les accès actuels par cette sauvegarde ?"
                    )
                ){

                    return;

                }


                accounts =
                    imported;


                saveData();

                updateUserCount();

                renderAccounts();


                alert(
                    "Sauvegarde restaurée."
                );


            }catch(error){

                alert(
                    "Impossible de lire cette sauvegarde."
                );

            }

        };


    reader.readAsText(
        file
    );


    event.target.value =
        "";

}
