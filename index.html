<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f2f2f7;
    color:#111;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none !important;
}

/* =========================
   CONNEXION
========================= */

#loginScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#f2f2f7;
}

.loginBox{
    width:100%;
    max-width:380px;
    background:white;
    border-radius:22px;
    padding:30px 24px;
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    text-align:center;
}

.loginBox h1{
    margin:0 0 10px;
    font-size:28px;
}

.loginBox p{
    color:#666;
    margin-bottom:22px;
}

#pinInput{
    width:100%;
    padding:16px;
    border:1px solid #ddd;
    border-radius:14px;
    font-size:22px;
    text-align:center;
    letter-spacing:8px;
}

.loginButton{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:14px;
    background:#007aff;
    color:white;
    font-size:17px;
    font-weight:600;
}

.loginError{
    color:#ff3b30;
    margin-top:12px;
    min-height:20px;
}

/* =========================
   APPLICATION
========================= */

#app{
    min-height:100vh;
}

.header{
    position:sticky;
    top:0;
    z-index:50;
    background:#007aff;
    color:white;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.headerTop{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.header h1{
    margin:0;
    font-size:23px;
}

.userCount{
    background:rgba(255,255,255,.2);
    padding:7px 11px;
    border-radius:20px;
    font-size:14px;
    white-space:nowrap;
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:15px;
}

/* =========================
   BARRE ACTIONS
========================= */

.topActions{
    display:flex;
    gap:8px;
    margin-bottom:12px;
}

.topActions button{
    flex:1;
}

.primaryButton{
    background:#007aff;
    color:white;
    border:0;
    border-radius:12px;
    padding:13px 10px;
    font-size:15px;
    font-weight:600;
}

.secondaryButton{
    background:white;
    color:#007aff;
    border:1px solid #007aff;
    border-radius:12px;
    padding:13px 10px;
    font-size:15px;
    font-weight:600;
}

.dangerButton{
    background:#ff3b30;
    color:white;
    border:0;
    border-radius:12px;
    padding:13px 10px;
    font-size:15px;
    font-weight:600;
}

.searchBox{
    width:100%;
    padding:14px 15px;
    border:1px solid #ddd;
    border-radius:13px;
    background:white;
    font-size:16px;
    margin-bottom:15px;
}

/* =========================
   FORMULAIRE
========================= */

.formCard{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.formCard h2{
    margin:0 0 15px;
    font-size:20px;
}

.formGroup{
    margin-bottom:14px;
}

.formGroup label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:6px;
    color:#444;
}

.inputCopy{
    display:flex;
    gap:7px;
}

.inputCopy input{
    flex:1;
}

input[type="text"],
input[type="password"],
input[type="number"],
input[type="date"],
input[type="url"],
input[type="search"]{
    width:100%;
    padding:13px;
    border:1px solid #d5d5d5;
    border-radius:11px;
    font-size:16px;
    background:white;
}

.copyBtn{
    flex:0 0 45px;
    border:0;
    border-radius:10px;
    background:#e9f2ff;
    color:#007aff;
    font-size:19px;
    min-width:45px;
}

.passwordArea{
    display:flex;
    gap:7px;
}

.passwordArea input{
    flex:1;
}

.showPasswordBtn{
    flex:0 0 45px;
    border:0;
    border-radius:10px;
    background:#f0f0f0;
    font-size:18px;
}

.checkboxRow{
    display:flex;
    align-items:center;
    gap:9px;
    margin:15px 0;
}

.checkboxRow input{
    width:20px;
    height:20px;
}

.applicationBox{
    background:#f5f8ff;
    border:1px solid #dce9ff;
    border-radius:14px;
    padding:15px;
    margin-top:10px;
}

.applicationBox h3{
    margin:0 0 14px;
    color:#007aff;
    font-size:17px;
}

.photoButtons{
    display:flex;
    gap:8px;
}

.photoButtons button{
    flex:1;
}

.photoPreview{
    width:100%;
    max-height:250px;
    object-fit:contain;
    border-radius:12px;
    margin-top:10px;
    background:#eee;
}

.formButtons{
    display:flex;
    gap:8px;
    margin-top:18px;
}

.formButtons button{
    flex:1;
}

/* =========================
   COMPTES
========================= */

.accountCard{
    background:white;
    border-radius:18px;
    padding:17px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.accountHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.accountName{
    font-size:19px;
    font-weight:700;
    word-break:break-word;
}

.accountActions{
    display:flex;
    gap:6px;
    flex-shrink:0;
}

.iconButton{
    width:40px;
    height:40px;
    border:0;
    border-radius:10px;
    background:#f0f0f0;
    font-size:18px;
}

.iconButton.edit{
    color:#007aff;
}

.iconButton.delete{
    color:#ff3b30;
}

.accountLine{
    margin-bottom:11px;
}

.accountLabel{
    font-size:12px;
    font-weight:600;
    color:#777;
    margin-bottom:4px;
    text-transform:uppercase;
}

.copyArea{
    display:flex;
    align-items:center;
    gap:7px;
    min-width:0;
}

.valueText{
    flex:1;
    min-width:0;
    word-break:break-word;
    background:#f7f7f7;
    border-radius:9px;
    padding:10px;
    font-size:15px;
}

.urlLink{
    flex:1;
    min-width:0;
    color:#007aff;
    text-decoration:underline;
    word-break:break-all;
    background:#f7f7f7;
    border-radius:9px;
    padding:10px;
    display:block;
}

.passwordValue{
    font-family:monospace;
}

.remarque{
    white-space:pre-wrap;
}

.applicationSaved{
    margin-top:15px;
    background:#f5f8ff;
    border-radius:13px;
    padding:13px;
}

.applicationSaved h3{
    color:#007aff;
    font-size:16px;
    margin:0 0 12px;
}

.photoSaved{
    width:100%;
    max-height:300px;
    object-fit:contain;
    border-radius:12px;
    margin-top:10px;
    background:#eee;
}

/* =========================
   DUREE
========================= */

.durationBox{
    margin-top:14px;
    padding-top:13px;
    border-top:1px solid #eee;
}

.durationText{
    font-size:14px;
    font-weight:600;
}

.expirationText{
    font-size:14px;
    margin-top:4px;
}

.expGreen{
    color:#34c759;
}

.expOrange{
    color:#ff9500;
}

.expRed{
    color:#ff3b30;
}

.expGray{
    color:#777;
}

/* =========================
   BOUTON CALENDRIER
========================= */

.calendarButton{
    width:100%;
    margin-top:10px;
    padding:11px;
    border:0;
    border-radius:10px;
    background:#34c759;
    color:white;
    font-weight:600;
    font-size:14px;
}

/* =========================
   EMPTY
========================= */

.empty{
    text-align:center;
    padding:45px 15px;
    color:#777;
}

.emptyIcon{
    font-size:45px;
    margin-bottom:10px;
}

/* =========================
   MODAL PHOTO
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modalBox{
    background:white;
    width:100%;
    max-width:600px;
    border-radius:18px;
    padding:15px;
    max-height:90vh;
    overflow:auto;
}

.modalBox img{
    width:100%;
    max-height:70vh;
    object-fit:contain;
    border-radius:12px;
}

.modalClose{
    width:100%;
    margin-top:12px;
    padding:13px;
    border:0;
    border-radius:11px;
    background:#007aff;
    color:white;
    font-size:16px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){
    .topActions{
        flex-wrap:wrap;
    }

    .topActions button{
        min-width:calc(50% - 4px);
    }

    .accountHeader{
        align-items:flex-start;
    }
}
</style>
</head>

<body>

<!-- =========================
     ECRAN PIN
========================= -->

<div id="loginScreen">

    <div class="loginBox">

        <h1>🔐 Mes accès</h1>

        <p>Entrez votre code PIN pour accéder à vos informations.</p>

        <input
            id="pinInput"
            type="password"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
            autocomplete="off"
        >

        <button class="loginButton" onclick="login()">
            Ouvrir
        </button>

        <div id="loginError" class="loginError"></div>

    </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden">

    <header class="header">

        <div class="headerTop">

            <h1>🔐 Mes accès</h1>

            <div class="userCount" id="userCount">
                0 accès
            </div>

        </div>

    </header>


    <main class="container">

        <div class="topActions">

            <button
                class="primaryButton"
                onclick="showForm()"
            >
                ➕ Ajouter
            </button>

            <button
                class="secondaryButton"
                onclick="exportData()"
            >
                💾 Sauvegarde
            </button>

            <button
                class="secondaryButton"
                onclick="document.getElementById('importFile').click()"
            >
                📂 Restaurer
            </button>

            <input
                id="importFile"
                type="file"
                accept=".json,application/json"
                style="display:none"
                onchange="importData(event)"
            >

        </div>


        <input
            id="searchInput"
            class="searchBox"
            type="search"
            placeholder="🔎 Rechercher un accès..."
            oninput="renderAccounts()"
        >


        <!-- =========================
             FORMULAIRE
        ========================= -->

        <div id="formCard" class="formCard hidden">

            <h2 id="formTitle">
                Ajouter un accès
            </h2>


            <div class="formGroup">

                <label>
                    Nom / Prénom
                </label>

                <input
                    id="nameInput"
                    type="text"
                    placeholder="Nom et prénom"
                    autocomplete="off"
                >

            </div>


            <div class="formGroup">

                <label>
                    Utilisateur
                </label>

                <div class="inputCopy">

                    <input
                        id="usernameInput"
                        type="text"
                        placeholder="Nom d'utilisateur"
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('usernameInput')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="formGroup">

                <label>
                    Mot de passe
                </label>

                <div class="passwordArea">

                    <input
                        id="passwordInput"
                        type="password"
                        placeholder="Mot de passe"
                        autocomplete="new-password"
                    >

                    <button
                        class="showPasswordBtn"
                        onclick="togglePassword('passwordInput', this)"
                    >
                        👁️
                    </button>

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('passwordInput')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="formGroup">

                <label>
                    URL 1
                </label>

                <div class="inputCopy">

                    <input
                        id="url1Input"
                        type="url"
                        placeholder="https://..."
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('url1Input')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="formGroup">

                <label>
                    URL 2
                </label>

                <div class="inputCopy">

                    <input
                        id="url2Input"
                        type="url"
                        placeholder="https://..."
                        autocomplete="off"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('url2Input')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="formGroup">

                <label>
                    Remarque
                </label>

                <div class="inputCopy">

                    <input
                        id="noteInput"
                        type="text"
                        placeholder="Remarque"
                    >

                    <button
                        class="copyBtn"
                        onclick="copyInputValue('noteInput')"
                    >
                        📋
                    </button>

                </div>

            </div>


            <!-- APPLICATION -->

            <div class="checkboxRow">

                <input
                    id="applicationCheck"
                    type="checkbox"
                    onchange="toggleApplicationFields()"
                >

                <label for="applicationCheck">
                    Ajouter les informations de l'application
                </label>

            </div>


            <div
                id="applicationBox"
                class="applicationBox hidden"
            >

                <h3>
                    📱 Informations application
                </h3>


                <div class="formGroup">

                    <label>
                        URL application
                    </label>

                    <div class="inputCopy">

                        <input
                            id="appUrlInput"
                            type="url"
                            placeholder="https://..."
                        >

                        <button
                            class="copyBtn"
                            onclick="copyInputValue('appUrlInput')"
                        >
                            📋
                        </button>

                    </div>

                </div>


                <div class="formGroup">

                    <label>
                        MAC 1
                    </label>

                    <div class="inputCopy">

                        <input
                            id="mac1Input"
                            type="text"
                            placeholder="MAC 1"
                        >

                        <button
                            class="copyBtn"
                            onclick="copyInputValue('mac1Input')"
                        >
                            📋
                        </button>

                    </div>

                </div>


                <div class="formGroup">

                    <label>
                        Clé 1
                    </label>

                    <div class="inputCopy">

                        <input
                            id="key1Input"
                            type="text"
                            placeholder="Clé 1"
                        >

                        <button
                            class="copyBtn"
                            onclick="copyInputValue('key1Input')"
                        >
                            📋
                        </button>

                    </div>

                </div>


                <div class="formGroup">

                    <label>
                        MAC 2
                    </label>

                    <div class="inputCopy">

                        <input
                            id="mac2Input"
                            type="text"
                            placeholder="MAC 2"
                        >

                        <button
                            class="copyBtn"
                            onclick="copyInputValue('mac2Input')"
                        >
                            📋
                        </button>

                    </div>

                </div>


                <div class="formGroup">

                    <label>
                        Clé 2
                    </label>

                    <div class="inputCopy">

                        <input
                            id="key2Input"
                            type="text"
                            placeholder="Clé 2"
                        >

                        <button
                            class="copyBtn"
                            onclick="copyInputValue('key2Input')"
                        >
                            📋
                        </button>

                    </div>

                </div>

            </div>


            <!-- PHOTO -->

            <div class="formGroup">

                <label>
                    📷 Photo du document
                </label>

                <div class="photoButtons">

                    <button
                        type="button"
                        class="secondaryButton"
                        onclick="document.getElementById('photoGallery').click()"
                    >
                        🖼️ Mes photos
                    </button>

                    <button
                        type="button"
                        class="secondaryButton"
                        onclick="document.getElementById('photoCamera').click()"
                    >
                        📷 Prendre une photo
                    </button>

                </div>


                <input
                    id="photoGallery"
                    type="file"
                    accept="image/*"
                    style="display:none"
                    onchange="handlePhoto(event)"
                >

                <input
                    id="photoCamera"
                    type="file"
                    accept="image/*"
                    capture="environment"
                    style="display:none"
                    onchange="handlePhoto(event)"
                >


                <img
                    id="photoPreview"
                    class="photoPreview hidden"
                    alt="Aperçu"
                >

                <button
                    id="deletePhotoBtn"
                    type="button"
                    class="dangerButton hidden"
                    style="margin-top:8px;width:100%;"
                    onclick="deletePhoto()"
                >
                    🗑️ Supprimer la photo
                </button>

            </div>


            <!-- DUREE -->

            <div class="formGroup">

                <label>
                    Durée en jours
                </label>

                <input
                    id="durationInput"
                    type="number"
                    min="1"
                    placeholder="Exemple : 30"
                >

            </div>


            <div class="formButtons">

                <button
                    class="primaryButton"
                    onclick="saveAccount()"
                >
                    💾 Enregistrer
                </button>

                <button
                    class="secondaryButton"
                    onclick="cancelForm()"
                >
                    Annuler
                </button>

            </div>

        </div>


        <!-- LISTE -->

        <div id="accountsList"></div>

    </main>

</div>


<!-- =========================
     MODAL PHOTO
========================= -->

<div
    id="photoModal"
    class="modal hidden"
    onclick="closePhotoModal(event)"
>

    <div class="modalBox">

        <img
            id="modalPhoto"
            src=""
            alt="Photo"
        >

        <button
            class="modalClose"
            onclick="closePhotoModal()"
        >
            Fermer
        </button>

    </div>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const PIN = "1157";

const STORAGE_KEY = "mesAcces";

let accounts = [];

let editingId = null;

let currentPhoto = "";


/* =========================================================
   INITIALISATION
========================================================= */

document.addEventListener("DOMContentLoaded", function(){

    loadData();

    document
        .getElementById("pinInput")
        .addEventListener("keydown", function(event){

            if(event.key === "Enter"){
                login();
            }

        });

});


/* =========================================================
   CONNEXION
========================================================= */

function login(){

    const pin =
        document.getElementById("pinInput").value;

    const error =
        document.getElementById("loginError");

    if(pin === PIN){

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("app")
            .classList.remove("hidden");

        renderAccounts();

    }else{

        error.textContent =
            "Code PIN incorrect.";

        document
            .getElementById("pinInput")
            .value = "";

    }

}


/* =========================================================
   DONNEES
========================================================= */

function loadData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            const parsed =
                JSON.parse(saved);

            if(Array.isArray(parsed)){

                accounts = parsed;

            }else{

                accounts = [];

            }

        }

    }catch(error){

        console.error(error);

        accounts = [];

    }

    updateUserCount();

}


function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

    updateUserCount();

}


/* =========================================================
   COMPTEUR
========================================================= */

function updateUserCount(){

    const element =
        document.getElementById("userCount");

    if(!element){
        return;
    }

    const count = accounts.length;

    element.textContent =
        count +
        (count > 1 ? " accès" : " accès");

}


/* =========================================================
   FORMULAIRE
========================================================= */

function showForm(){

    editingId = null;

    resetForm();

    document
        .getElementById("formTitle")
        .textContent = "Ajouter un accès";

    document
        .getElementById("formCard")
        .classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function cancelForm(){

    document
        .getElementById("formCard")
        .classList.add("hidden");

    editingId = null;

    resetForm();

}


function resetForm(){

    document.getElementById("nameInput").value = "";

    document.getElementById("usernameInput").value = "";

    document.getElementById("passwordInput").value = "";

    document.getElementById("url1Input").value = "";

    document.getElementById("url2Input").value = "";

    document.getElementById("noteInput").value = "";

    document.getElementById("applicationCheck").checked = false;

    document.getElementById("appUrlInput").value = "";

    document.getElementById("mac1Input").value = "";

    document.getElementById("key1Input").value = "";

    document.getElementById("mac2Input").value = "";

    document.getElementById("key2Input").value = "";

    document.getElementById("durationInput").value = "";

    currentPhoto = "";

    document
        .getElementById("applicationBox")
        .classList.add("hidden");

    document
        .getElementById("photoPreview")
        .classList.add("hidden");

    document
        .getElementById("deletePhotoBtn")
        .classList.add("hidden");

    document.getElementById("photoPreview").src = "";

}


/* =========================================================
   APPLICATION
========================================================= */

function toggleApplicationFields(){

    const checked =
        document.getElementById("applicationCheck").checked;

    const box =
        document.getElementById("applicationBox");

    if(checked){

        box.classList.remove("hidden");

    }else{

        box.classList.add("hidden");

    }

}


/* =========================================================
   PHOTO
========================================================= */

function handlePhoto(event){

    const file =
        event.target.files &&
        event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        currentPhoto = e.target.result;

        const preview =
            document.getElementById("photoPreview");

        preview.src = currentPhoto;

        preview.classList.remove("hidden");

        document
            .getElementById("deletePhotoBtn")
            .classList.remove("hidden");

    };

    reader.readAsDataURL(file);

}


function deletePhoto(){

    currentPhoto = "";

    document.getElementById("photoPreview").src = "";

    document
        .getElementById("photoPreview")
        .classList.add("hidden");

    document
        .getElementById("deletePhotoBtn")
        .classList.add("hidden");

    document.getElementById("photoGallery").value = "";

    document.getElementById("photoCamera").value = "";

}


/* =========================================================
   ENREGISTRER
========================================================= */

function saveAccount(){

    const name =
        document.getElementById("nameInput").value.trim();

    const username =
        document.getElementById("usernameInput").value.trim();

    const password =
        document.getElementById("passwordInput").value;

    const url1 =
        document.getElementById("url1Input").value.trim();

    const url2 =
        document.getElementById("url2Input").value.trim();

    const note =
        document.getElementById("noteInput").value.trim();

    const application =
        document.getElementById("applicationCheck").checked;

    const durationValue =
        document.getElementById("durationInput").value;

    const duration =
        Number(durationValue);


    if(!name){

        alert("Veuillez entrer un nom / prénom.");

        return;

    }


    if(!duration || duration < 1){

        alert("Veuillez entrer une durée en jours.");

        return;

    }


    const data = {

        id:
            editingId ||
            Date.now().toString(),

        name:name,

        username:username,

        password:password,

        url1:url1,

        url2:url2,

        note:note,

        application:application,

        appUrl:
            application
            ? document.getElementById("appUrlInput").value.trim()
            : "",

        mac1:
            application
            ? document.getElementById("mac1Input").value.trim()
            : "",

        key1:
            application
            ? document.getElementById("key1Input").value.trim()
            : "",

        mac2:
            application
            ? document.getElementById("mac2Input").value.trim()
            : "",

        key2:
            application
            ? document.getElementById("key2Input").value.trim()
            : "",

        photo:currentPhoto,

        duration:duration,

        startDate:
            editingId
            ? getExistingStartDate(editingId)
            : new Date().toISOString()

    };


    if(editingId){

        const index =
            accounts.findIndex(
                account => account.id === editingId
            );

        if(index !== -1){

            accounts[index] = data;

        }

    }else{

        accounts.push(data);

    }


    saveData();

    cancelForm();

    renderAccounts();

}


function getExistingStartDate(id){

    const existing =
        accounts.find(
            account => account.id === id
        );

    if(existing && existing.startDate){

        return existing.startDate;

    }

    return new Date().toISOString();

}


/* =========================================================
   MODIFIER
========================================================= */

/* =========================================================
   SUPPRIMER
========================================================= */

function deleteAccount(id){

    const account =
        accounts.find(
            item => item.id === id
        );

    if(!account){
        return;
    }


    const confirmed =
        confirm(
            "Supprimer l'accès de " +
            account.name +
            " ?"
        );


    if(!confirmed){
        return;
    }


    accounts =
        accounts.filter(
            item => item.id !== id
        );


    saveData();

    renderAccounts();

}


/* =========================================================
   URL
========================================================= */

function normalizeUrl(url){

    if(!url){
        return "";
    }

    let value =
        String(url).trim();

    if(!value){
        return "";
    }


    if(
        !value.startsWith("http://") &&
        !value.startsWith("https://")
    ){

        value =
            "https://" + value;

    }

    return value;

}


/*
    IMPORTANT :
    Cette fonction est appelée directement par le clic
    sur l'URL.

    Elle demande à l'iPhone d'ouvrir l'adresse dans
    une nouvelle page/onglet.

    L'application Mes accès reste donc ouverte.
*/

function openUrlInNewPage(event, url){

    if(event){
        event.preventDefault();
        event.stopPropagation();
    }


    const finalUrl =
        normalizeUrl(url);


    if(!finalUrl){
        return false;
    }


    /*
       window.open est déclenché directement par
       l'action de l'utilisateur.
    */

    window.open(
        finalUrl,
        "_blank",
        "noopener,noreferrer"
    );


    return false;

}


/* =========================================================
   AFFICHAGE
========================================================= */

function renderAccounts(){

    const container =
        document.getElementById("accountsList");

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    let filtered =
        accounts.filter(account => {

            const text = [

                account.name,
                account.username,
                account.url1,
                account.url2,
                account.note,
                account.appUrl,
                account.mac1,
                account.key1,
                account.mac2,
                account.key2

            ]
            .join(" ")
            .toLowerCase();


            return text.includes(search);

        });


    /*
       Tri alphabétique Nom / Prénom
    */

    filtered.sort(function(a,b){

        return String(a.name || "")
            .localeCompare(
                String(b.name || ""),
                "fr",
                {
                    sensitivity:"base"
                }
            );

    });


    if(filtered.length === 0){

        container.innerHTML =

            '<div class="empty">' +
                '<div class="emptyIcon">🔐</div>' +
                '<div>Aucun accès trouvé.</div>' +
            '</div>';

        updateUserCount();

        return;

    }


    let html = "";


    filtered.forEach(function(account){

        html += renderAccount(account);

    });


    container.innerHTML = html;

    updateUserCount();

}

/* =========================================================
   LIGNE TEXTE + COPIE
========================================================= */

function accountLineCopy(label, value){

    return (

        '<div class="accountLine">' +

            '<div class="accountLabel">' +
                escapeHtml(label) +
            '</div>' +

            '<div class="copyArea">' +

                '<div class="valueText">' +
                    escapeHtml(value) +
                '</div>' +

                '<button ' +
                    'class="copyBtn" ' +
                    'onclick="copySavedValue(this)" ' +
                    'data-copy="' +
                    escapeHtml(value) +
                    '">' +
                    '📋' +
                '</button>' +

            '</div>' +

        '</div>'

    );

}


/* =========================================================
   LIGNE URL
========================================================= */

function accountUrlLine(label, value){

    const normalized =
        normalizeUrl(value);


    /*
       L'URL elle-même est cliquable.

       Le clic utilise openUrlInNewPage()
       pour demander une nouvelle page/onglet.
    */

    return (

        '<div class="accountLine">' +

            '<div class="accountLabel">' +
                escapeHtml(label) +
            '</div>' +

            '<div class="copyArea">' +

                '<a ' +
                    'class="urlLink" ' +
                    'href="' +
                    escapeAttribute(normalized) +
                    '" ' +
                    'target="_blank" ' +
                    'rel="noopener noreferrer" ' +
                    'onclick="return openUrlInNewPage(event, this.href);">' +

                    escapeHtml(value) +

                '</a>' +

                '<button ' +
                    'class="copyBtn" ' +
                    'onclick="copySavedValue(this)" ' +
                    'data-copy="' +
                    escapeHtml(value) +
                    '">' +
                    '📋' +
                '</button>' +

            '</div>' +

        '</div>'

    );

}


/* =========================================================
   DUREE / EXPIRATION
========================================================= */

function renderDuration(account){

    if(!account.duration || !account.startDate){

        return "";

    }


    const start =
        new Date(account.startDate);

    const expiration =
        new Date(start.getTime() +
        Number(account.duration) *
        24 *
        60 *
        60 *
        1000);


    const now =
        new Date();


    const difference =
        expiration.getTime() -
        now.getTime();


    const daysRemaining =
        Math.ceil(
            difference /
            (24 * 60 * 60 * 1000)
        );


    let className =
        "expGreen";


    if(daysRemaining < 0){

        className = "expGray";

    }else if(daysRemaining <= 2){

        className = "expRed";

    }else if(daysRemaining <= 7){

        className = "expOrange";

    }


    let remainingText;


    if(daysRemaining < 0){

        remainingText =
            "Expiré";

    }else if(daysRemaining === 0){

        remainingText =
            "Expire aujourd'hui";

    }else if(daysRemaining === 1){

        remainingText =
            "Il reste 1 jour";

    }else{

        remainingText =
            "Il reste " +
            daysRemaining +
            " jours";

    }


    const expirationDate =
        expiration.toLocaleDateString(
            "fr-BE",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );


    return (

        '<div class="durationBox">' +

            '<div class="durationText ' +
                className +
            '">' +

                '⏳ ' +
                escapeHtml(remainingText) +

            '</div>' +

            '<div class="expirationText">' +

                'Durée : ' +
                escapeHtml(String(account.duration)) +
                ' jour(s) • Expiration : ' +
                escapeHtml(expirationDate) +

            '</div>' +

            '<button ' +
                'class="calendarButton" ' +
                'onclick="addCalendarReminder(\'' +
                escapeJs(account.id) +
                '\')">' +

                '📅 Rappel Google Calendar' +

            '</button>' +

        '</div>'

    );

}


/* =========================================================
   MOT DE PASSE SAUVEGARDE
========================================================= */

function toggleSavedPassword(button){

    const area =
        button.parentElement;

    const passwordElement =
        area.querySelector(".passwordValue");

    if(!passwordElement){
        return;
    }


    const password =
        passwordElement.getAttribute(
            "data-password"
        );


    const visible =
        passwordElement.dataset.visible === "true";


    if(visible){

        passwordElement.textContent =
            "••••••••";

        passwordElement.dataset.visible =
            "false";

        button.textContent = "👁️";

    }else{

        passwordElement.textContent =
            password;

        passwordElement.dataset.visible =
            "true";

        button.textContent = "🙈";

    }

}


/* =========================================================
   COPIER
========================================================= */

function copyInputValue(id){

    const input =
        document.getElementById(id);

    if(!input){
        return;
    }

    copyText(
        input.value,
        null
    );

}


function copySavedValue(button){

    if(!button){
        return;
    }

    const value =
        button.getAttribute("data-copy") || "";

    copyText(
        value,
        button
    );

}


function copyText(text, button){

    if(!text){

        return;

    }


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
            .writeText(text)
            .then(function(){

                copySuccess(button);

            })
            .catch(function(){

                fallbackCopy(text, button);

            });

    }else{

        fallbackCopy(text, button);

    }

}


function fallbackCopy(text, button){

    const textarea =
        document.createElement("textarea");

    textarea.value = text;

    textarea.style.position = "fixed";

    textarea.style.left = "-9999px";

    document.body.appendChild(textarea);

    textarea.focus();

    textarea.select();


    try{

        document.execCommand("copy");

        copySuccess(button);

    }catch(error){

        alert(
            "Impossible de copier automatiquement. " +
            "Vous pouvez sélectionner le texte manuellement."
        );

    }


    document.body.removeChild(textarea);

}


function copySuccess(button){

    if(!button){
        return;
    }

    const old =
        button.textContent;

    button.textContent =
        "✅";


    setTimeout(function(){

        button.textContent =
            old;

    },1000);

}


/* =========================================================
   MOT DE PASSE FORMULAIRE
========================================================= */

function togglePassword(id, button){

    const input =
        document.getElementById(id);

    if(!input){
        return;
    }


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }

}

/* =========================================================
   GOOGLE CALENDAR
========================================================= */

function addCalendarReminder(id){

    const account =
        accounts.find(
            item => item.id === id
        );


    if(!account){

        return;

    }


    if(!account.duration || !account.startDate){

        alert(
            "Aucune durée disponible pour cet accès."
        );

        return;

    }


    const start =
        new Date(account.startDate);


    const expiration =
        new Date(
            start.getTime() +
            Number(account.duration) *
            24 *
            60 *
            60 *
            1000
        );


    /*
       Rappel exactement 2 jours avant expiration.
    */

    const reminder =
        new Date(
            expiration.getTime() -
            2 *
            24 *
            60 *
            60 *
            1000
        );


    const formatCalendarDate =
        function(date){

            return date
                .toISOString()
                .replace(/[-:]/g,"")
                .replace(/\.\d{3}/,"");

        };


    const dateStart =
        formatCalendarDate(reminder);


    const dateEnd =
        formatCalendarDate(
            new Date(
                reminder.getTime() +
                60 * 60 * 1000
            )
        );


    const title =
        encodeURIComponent(
            "Expiration accès - " +
            account.name
        );


    const details =
        encodeURIComponent(
            "L'accès de " +
            account.name +
            " expire le " +
            expiration.toLocaleDateString("fr-BE")
        );


    const url =
        "https://calendar.google.com/calendar/render" +
        "?action=TEMPLATE" +
        "&text=" + title +
        "&dates=" + dateStart +
        "/" + dateEnd +
        "&details=" + details;


    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================================================
   SAUVEGARDE JSON
========================================================= */

function exportData(){

    const data =
        JSON.stringify(
            accounts,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:"application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "mes-acces-sauvegarde.json";


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/* =========================================================
   RESTAURATION JSON
========================================================= */

function importData(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){
        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const imported =
                    JSON.parse(e.target.result);


                if(!Array.isArray(imported)){

                    throw new Error(
                        "Format invalide"
                    );

                }


                const confirmed =
                    confirm(
                        "La restauration va remplacer les accès actuellement enregistrés. Continuer ?"
                    );


                if(!confirmed){
                    return;
                }


                accounts =
                    imported;


                saveData();

                renderAccounts();


                alert(
                    "Sauvegarde restaurée avec succès."
                );


            }catch(error){

                alert(
                    "Impossible de restaurer cette sauvegarde."
                );

            }

        };


    reader.readAsText(file);


    event.target.value = "";

}


/* =========================================================
   SECURITE AFFICHAGE
========================================================= */

function escapeHtml(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/"/g,"&quot;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}


function escapeJs(value){

    return String(value ?? "")
        .replace(/\\/g,"\\\\")
        .replace(/'/g,"\\'")
        .replace(/"/g,'\\"')
        .replace(/\n/g,"\\n")
        .replace(/\r/g,"\\r");

}
