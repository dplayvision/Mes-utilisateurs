<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f2f2f7;
    color:#111;
}

header{
    background:#007aff;
    color:white;
    padding:18px 16px;
    padding-top:calc(18px + env(safe-area-inset-top));
    text-align:center;
    font-size:22px;
    font-weight:700;
    position:sticky;
    top:0;
    z-index:20;
}

.container{
    padding:15px;
    max-width:700px;
    margin:auto;
}

.card,
.account{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    margin:0 0 15px;
    font-size:20px;
}

label{
    display:block;
    font-weight:600;
    margin:12px 0 6px;
}

input[type="text"],
input[type="password"]{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:10px;
    font-size:16px;
    background:#fff;
}

.inputRow{
    display:flex;
    gap:8px;
}

.inputRow input{
    flex:1;
    min-width:0;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.copyBtn{
    background:#e5e5ea;
    color:#111;
    white-space:nowrap;
}

.primary{
    width:100%;
    background:#007aff;
    color:white;
    margin-top:18px;
    font-size:17px;
}

.cancel{
    width:100%;
    background:#e5e5ea;
    margin-top:8px;
}

.delete{
    background:#ff3b30;
    color:white;
}

.edit{
    background:#ff9500;
    color:white;
}

.show{
    background:#e5e5ea;
    min-width:48px;
}

/* APPLICATION */

.applicationBox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
    font-size:17px;
    font-weight:600;
}

.applicationBox input{
    width:22px;
    height:22px;
}

.appFields{
    display:none;
    margin-top:8px;
}

.sectionTitle{
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid #e5e5ea;
    font-size:16px;
    font-weight:700;
}

/* PHOTO */

.photoBox{
    margin-top:18px;
    padding-top:14px;
    border-top:1px solid #e5e5ea;
}

.photoButtons{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.photoButton{
    flex:1;
    background:#e5e5ea;
}

.photoPreview{
    margin-top:12px;
    display:none;
}

.photoPreview img{
    width:100%;
    max-height:300px;
    object-fit:contain;
    border-radius:12px;
    background:#f2f2f7;
}

.removePhoto{
    width:100%;
    margin-top:8px;
    background:#ff3b30;
    color:white;
}

/* ACCES */

.accountTitle{
    margin-bottom:15px;
}

.accountName{
    font-size:20px;
    font-weight:700;
    margin-bottom:5px;
}

.appBadge{
    display:inline-block;
    background:#34c759;
    color:white;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.line{
    margin-top:12px;
}

.lineTitle{
    font-size:13px;
    color:#666;
    margin-bottom:4px;
}

.valueRow{
    display:flex;
    gap:8px;
    align-items:center;
}

.value{
    flex:1;
    background:#f2f2f7;
    padding:11px;
    border-radius:9px;
    min-height:42px;
    overflow:hidden;
    word-break:break-word;
}

/* URL CLIQUABLE */

.urlLink{
    color:#007aff;
    text-decoration:underline;
    display:block;
    width:100%;
    min-height:20px;
    word-break:break-all;
    cursor:pointer;
    -webkit-user-select:text;
    user-select:text;
}

.urlLink:active{
    opacity:.5;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.actions button{
    flex:1;
}

/* PHOTO SAUVEGARDEE */

.savedPhoto{
    margin-top:15px;
}

.savedPhoto img{
    width:100%;
    max-height:280px;
    object-fit:contain;
    border-radius:12px;
    background:#f2f2f7;
}

/* RECHERCHE */

.search{
    margin-bottom:15px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:12px;
    font-size:16px;
}

.counter{
    color:#666;
    font-size:14px;
    margin-bottom:12px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.hidden{
    display:none !important;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
}

/* PIN */

.pinScreen{
    position:fixed;
    inset:0;
    background:#f2f2f7;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.pinBox{
    width:100%;
    max-width:360px;
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

.pinLogo{
    font-size:45px;
    margin-bottom:10px;
}

.pinBox h1{
    margin:0 0 8px;
    font-size:25px;
}

.pinBox p{
    color:#777;
    margin-bottom:20px;
}

.pinInput{
    width:100%;
    padding:15px;
    border:1px solid #d1d1d6;
    border-radius:12px;
    font-size:25px;
    text-align:center;
    letter-spacing:8px;
}

.pinButton{
    width:100%;
    margin-top:15px;
    background:#007aff;
    color:white;
    font-size:17px;
}

.pinError{
    color:#ff3b30;
    margin-top:12px;
    min-height:20px;
    font-weight:600;
}

/* SAUVEGARDE */

.backupButtons{
    display:flex;
    gap:8px;
}

.backupButtons button{
    flex:1;
}

.backup{
    background:#34c759;
    color:white;
}

.restore{
    background:#5856d6;
    color:white;
}

#restoreFile,
#photoInput{
    display:none;
}

@media(max-width:500px){

    .actions,
    .backupButtons,
    .photoButtons{
        flex-direction:column;
    }

}
</style>
</head>

<body>

<!-- ========================= -->
<!-- PIN -->
<!-- ========================= -->

<div class="pinScreen" id="pinScreen">

    <div class="pinBox">

        <div class="pinLogo">🔐</div>

        <h1>Mes accès</h1>

        <p>Entrez votre code pour continuer</p>

        <input
            type="password"
            id="pinInput"
            class="pinInput"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
        >

        <button
            class="pinButton"
            type="button"
            onclick="checkPin()"
        >
            🔓 Ouvrir
        </button>

        <div
            class="pinError"
            id="pinError"
        ></div>

    </div>

</div>


<!-- ========================= -->
<!-- APPLICATION -->
<!-- ========================= -->

<div id="app" class="hidden">

<header>
    🔐 Mes accès
</header>

<div class="container">


<!-- ========================= -->
<!-- AJOUTER / MODIFIER -->
<!-- ========================= -->

<div class="card">

<h2 id="formTitle">
    ➕ Ajouter un accès
</h2>


<!-- NOM / PRENOM -->

<label>
    👤 Nom / Prénom
</label>

<input
    type="text"
    id="personName"
    autocomplete="off"
    placeholder="Nom et prénom"
>


<!-- UTILISATEUR -->

<label>
    👤 Utilisateur
</label>

<div class="inputRow">

    <input
        type="text"
        id="username"
        autocomplete="off"
        placeholder="Utilisateur"
    >

    <button
        class="copyBtn"
        type="button"
        onclick="copyInput('username')"
    >
        📋
    </button>

</div>


<!-- MOT DE PASSE -->

<label>
    🔑 Mot de passe
</label>

<div class="inputRow">

    <input
        type="password"
        id="password"
        autocomplete="off"
        placeholder="Mot de passe"
    >

    <button
        class="show"
        type="button"
        onclick="togglePasswordInput(this)"
    >
        👁️
    </button>

    <button
        class="copyBtn"
        type="button"
        onclick="copyInput('password')"
    >
        📋
    </button>

</div>


<!-- URL -->

<label>
    🌐 URL 1
</label>

<div class="inputRow">

    <input
        type="text"
        id="url1"
        autocomplete="off"
        placeholder="https://..."
    >

    <button
        class="copyBtn"
        type="button"
        onclick="copyInput('url1')"
    >
        📋
    </button>

</div>


<!-- PHOTO -->

<div class="photoBox">

    <label>
        📷 Photo
    </label>

    <div class="photoButtons">

        <button
            type="button"
            class="photoButton"
            onclick="openPhotoPicker()"
        >
            📷 Ajouter une photo
        </button>

    </div>

    <input
        type="file"
        id="photoInput"
        accept="image/*"
        onchange="handlePhoto(event)"
    >

    <div
        class="photoPreview"
        id="photoPreview"
    >

        <img
            id="photoPreviewImg"
            src=""
            alt="Photo"
        >

        <button
            type="button"
            class="removePhoto"
            onclick="removePhoto()"
        >
            🗑️ Supprimer la photo
        </button>

    </div>

</div>


<!-- APPLICATION -->

<div class="applicationBox">

    <input
        type="checkbox"
        id="application"
        onchange="toggleApplicationFields()"
    >

    <span>
        📱 Application
    </span>

</div>


<div
    id="appFields"
    class="appFields"
>

    <div class="sectionTitle">
        📱 Informations application
    </div>


    <!-- URL APPLICATION -->

    <label>
        🌐 URL 1
    </label>

    <div class="inputRow">

        <input
            type="text"
            id="appUrl1"
            autocomplete="off"
            placeholder="https://..."
        >

        <button
            class="copyBtn"
            type="button"
            onclick="copyInput('appUrl1')"
        >
            📋
        </button>

    </div>


    <!-- MAC -->

    <label>
        📱 MAC
    </label>

    <div class="inputRow">

        <input
            type="text"
            id="mac"
            autocomplete="off"
            placeholder="Adresse MAC"
        >

        <button
            class="copyBtn"
            type="button"
            onclick="copyInput('mac')"
        >
            📋
        </button>

    </div>


    <!-- CLE -->

    <label>
        🔑 Clé
    </label>

    <div class="inputRow">

        <input
            type="text"
            id="key"
            autocomplete="off"
            placeholder="Clé"
        >

        <button
            class="copyBtn"
            type="button"
            onclick="copyInput('key')"
        >
            📋
        </button>

    </div>

</div>


<!-- ENREGISTRER -->

<button
    class="primary"
    id="saveButton"
    type="button"
    onclick="saveAccount()"
>
    💾 Enregistrer
</button>


<button
    class="cancel hidden"
    id="cancelButton"
    type="button"
    onclick="cancelEdit()"
>
    Annuler
</button>

</div>


<!-- ========================= -->
<!-- SAUVEGARDE -->
<!-- ========================= -->

<div class="card">

<h2>
    💾 Sauvegarde
</h2>

<p style="color:#666;font-size:14px;">
    Télécharge une copie de tes accès pour pouvoir les restaurer.
</p>

<div class="backupButtons">

    <button
        class="backup"
        type="button"
        onclick="downloadBackup()"
    >
        💾 Télécharger
    </button>

    <button
        class="restore"
        type="button"
        onclick="document.getElementById('restoreFile').click()"
    >
        📥 Restaurer
    </button>

</div>

<input
    type="file"
    id="restoreFile"
    accept=".json,application/json"
    onchange="restoreBackup(event)"
>

</div>


<!-- ========================= -->
<!-- RECHERCHE -->
<!-- ========================= -->

<div class="search">

<input
    type="text"
    id="search"
    placeholder="🔎 Rechercher..."
    oninput="renderAccounts()"
>

</div>

<div
    class="counter"
    id="counter"
></div>

<div id="accounts"></div>

</div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* ========================= */
/* VARIABLES */
/* ========================= */

const PIN = "1157";

const STORAGE_KEY = "mesAcces";

let accounts = [];

let editingId = null;

let currentPhoto = "";


/* ========================= */
/* PIN */
/* ========================= */

function checkPin(){

    const value =
        document
            .getElementById("pinInput")
            .value;

    const error =
        document
            .getElementById("pinError");


    if(value === PIN){

        document
            .getElementById("pinScreen")
            .classList
            .add("hidden");

        document
            .getElementById("app")
            .classList
            .remove("hidden");

        error.textContent = "";

        loadAccounts();

    }else{

        error.textContent =
            "Code incorrect";

        document
            .getElementById("pinInput")
            .value = "";

        document
            .getElementById("pinInput")
            .focus();

    }

}


document
    .getElementById("pinInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                checkPin();

            }

        }
    );


/* ========================= */
/* CHARGER LES ACCES */
/* ========================= */

function loadAccounts(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(saved){

            accounts =
                JSON.parse(saved);

            if(!Array.isArray(accounts)){

                accounts = [];

            }

        }

    }catch(error){

        accounts = [];

    }

    renderAccounts();

}


/* ========================= */
/* SAUVEGARDER */
/* ========================= */

function saveData(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(accounts)
        );

    }catch(error){

        alert(
            "Impossible d'enregistrer les données."
        );

    }

}


/* ========================= */
/* APPLICATION */
/* ========================= */

function toggleApplicationFields(){

    const checkbox =
        document
            .getElementById("application");

    const fields =
        document
            .getElementById("appFields");


    fields.style.display =
        checkbox.checked
        ? "block"
        : "none";

}


/* ========================= */
/* MOT DE PASSE */
/* ========================= */

function togglePasswordInput(button){

    const input =
        document
            .getElementById("password");


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* ========================= */
/* PHOTO */
/* ========================= */

function openPhotoPicker(){

    document
        .getElementById("photoInput")
        .click();

}


function handlePhoto(event){

    const file =
        event.target.files[0];

    if(!file){

        return;

    }


    if(!file.type.startsWith("image/")){

        alert(
            "Veuillez sélectionner une image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            currentPhoto =
                e.target.result;


            document
                .getElementById(
                    "photoPreviewImg"
                )
                .src =
                currentPhoto;


            document
                .getElementById(
                    "photoPreview"
                )
                .style.display =
                "block";

        };


    reader.readAsDataURL(file);

}


function removePhoto(){

    currentPhoto = "";

    document
        .getElementById("photoInput")
        .value = "";

    document
        .getElementById("photoPreviewImg")
        .src = "";

    document
        .getElementById("photoPreview")
        .style.display =
        "none";

}


/* ========================= */
/* NORMALISER URL */
/* ========================= */

function normalizeUrl(url){

    let value =
        String(url || "")
        .trim();


    if(!value){

        return "";

    }


    if(
        /^https?:\/\//i.test(value)
    ){

        return value;

    }


    return "https://" + value;

}


/* ========================= */
/* CREER UN LIEN URL */
/* ========================= */

function createUrlLink(url){

    const cleanUrl =
        normalizeUrl(url);


    if(!cleanUrl){

        return "";

    }


    const link =
        document.createElement("a");


    link.className =
        "urlLink";


    link.href =
        cleanUrl;


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.textContent =
        url;


    return link.outerHTML;

}


/* ========================= */
/* COPIE */
/* ========================= */

function copyInput(id){

    const input =
        document
            .getElementById(id);


    if(
        !input ||
        !input.value
    ){

        showToast(
            "Rien à copier"
        );

        return;

    }


    copyText(
        input.value
    );

}


function copyValue(value){

    if(!value){

        showToast(
            "Rien à copier"
        );

        return;

    }


    copyText(
        String(value)
    );

}


function copyText(value){

    if(
        navigator.clipboard &&
        window.isSecureContext
    ){

        navigator.clipboard
            .writeText(value)
            .then(function(){

                showToast(
                    "Copié 📋"
                );

            })
            .catch(function(){

                copyTextFallback(value);

            });

        return;

    }


    copyTextFallback(value);

}


function copyTextFallback(value){

    const textarea =
        document.createElement(
            "textarea"
        );


    textarea.value =
        value;


    textarea.setAttribute(
        "readonly",
        ""
    );


    textarea.style.position =
        "fixed";

    textarea.style.left =
        "-9999px";

    textarea.style.top =
        "0";


    document.body.appendChild(
        textarea
    );


    textarea.focus();

    textarea.select();


    let success = false;


    try{

        success =
            document.execCommand(
                "copy"
            );

    }catch(error){

        success = false;

    }


    textarea.remove();


    if(success){

        showToast(
            "Copié 📋"
        );

    }else{

        showToast(
            "Sélectionnez le texte pour le copier"
        );

    }

}


/* ========================= */
/* ENREGISTRER ACCES */
/* ========================= */

function saveAccount(){

    const personName =
        document
            .getElementById("personName")
            .value
            .trim();


    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value;


    const url1 =
        document
            .getElementById("url1")
            .value
            .trim();


    const application =
        document
            .getElementById("application")
            .checked;


    const appUrl1 =
        document
            .getElementById("appUrl1")
            .value
            .trim();


    const mac =
        document
            .getElementById("mac")
            .value
            .trim();


    const key =
        document
            .getElementById("key")
            .value
            .trim();


    if(!personName){

        alert(
            "Veuillez entrer le nom / prénom."
        );

        return;

    }


    if(!username){

        alert(
            "Veuillez entrer un utilisateur."
        );

        return;

    }


    if(!password){

        alert(
            "Veuillez entrer un mot de passe."
        );

        return;

    }


    if(!url1){

        alert(
            "Veuillez entrer l'URL."
        );

        return;

    }


    if(editingId !== null){

        const account =
            accounts.find(
                a =>
                    Number(a.id) ===
                    Number(editingId)
            );


        if(account){

            account.personName =
                personName;

            account.username =
                username;

            account.password =
                password;

            account.url1 =
                url1;

            account.application =
                application;

            account.appUrl1 =
                application
                ? appUrl1
                : "";

            account.mac =
                application
                ? mac
                : "";

            account.key =
                application
                ? key
                : "";

            account.photo =
                currentPhoto || "";

        }


        showToast(
            "Accès modifié ✅"
        );


    }else{

        accounts.unshift({

            id:
                Date.now(),

            personName:
                personName,

            username:
                username,

            password:
                password,

            url1:
                url1,

            application:
                application,

            appUrl1:
                application
                ? appUrl1
                : "",

            mac:
                application
                ? mac
                : "",

            key:
                application
                ? key
                : "",

            photo:
                currentPhoto || "",

            createdAt:
                new Date()
                .toISOString()

        });


        showToast(
            "Accès enregistré ✅"
        );

    }


    saveData();

    clearForm();

    renderAccounts();

}


/* ========================= */
/* AFFICHER LES ACCES */
/* ========================= */

function renderAccounts(){

    const container =
        document.getElementById(
            "accounts"
        );


    const search =
        document
            .getElementById("search")
            .value
            .trim()
            .toLowerCase();


    const filtered =
        accounts.filter(
            function(account){

                const searchable = [

                    account.personName,
                    account.username,
                    account.url1,
                    account.appUrl1,
                    account.mac,
                    account.key

                ];


                return searchable.some(
                    function(value){

                        return String(
                            value || ""
                        )
                        .toLowerCase()
                        .includes(search);

                    }
                );

            }
        );


    document
        .getElementById("counter")
        .textContent =
        filtered.length +
        " accès";


    container.innerHTML = "";


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="card empty">

                Aucun accès enregistré.

            </div>

        `;

        return;

    }


    filtered.forEach(
        function(account){

            const card =
                document.createElement(

/* ========================= */
/* COPIER DANS LES ACCES */
/* ========================= */

document.addEventListener(
    "click",
    function(event){

        const button =
            event.target.closest(
                ".accountCopy"
            );


        if(!button){

            return;

        }


        const id =
            Number(
                button.dataset.id
            );


        const field =
            button.dataset.field;


        const account =
            accounts.find(
                a =>
                    Number(a.id) ===
                    id
            );


        if(!account){

            return;

        }


        copyValue(
            account[field]
        );

    }
);


/* ========================= */
/* AFFICHER MOT DE PASSE */
/* ========================= */

function showPasswordAccount(
    id,
    button
){

    const account =
        accounts.find(
            a =>
                Number(a.id) ===
                Number(id)
        );


    if(!account){

        return;

    }


    const element =
        document.getElementById(
            "pass-" + id
        );


    if(
        element.dataset.visible ===
        "true"
    ){

        element.textContent =
            "••••••••••";

        element.dataset.visible =
            "false";

        button.textContent =
            "👁️";

    }else{

        element.textContent =
            account.password;

        element.dataset.visible =
            "true";

        button.textContent =
            "🙈";

    }

}


/* ========================= */
/* MODIFIER */
/* ========================= */

function editAccount(id){

    const account =
        accounts.find(
            a =>
                Number(a.id) ===
                Number(id)
        );


    if(!account){

        return;

    }


    editingId =
        id;


    document
        .getElementById("personName")
        .value =
        account.personName || "";


    document
        .getElementById("username")
        .value =
        account.username || "";


    document
        .getElementById("password")
        .value =
        account.password || "";


    document
        .getElementById("url1")
        .value =
        account.url1 || "";


    document
        .getElementById("application")
        .checked =
        !!account.application;


    document
        .getElementById("appUrl1")
        .value =
        account.appUrl1 || "";


    document
        .getElementById("mac")
        .value =
        account.mac || "";


    document
        .getElementById("key")
        .value =
        account.key || "";


    currentPhoto =
        account.photo || "";


    if(currentPhoto){

        document
            .getElementById(
                "photoPreviewImg"
            )
            .src =
            currentPhoto;

        document
            .getElementById(
                "photoPreview"
            )
            .style.display =
            "block";

    }else{

        document
            .getElementById(
                "photoPreview"
            )
            .style.display =
            "none";

    }


    document
        .getElementById(
            "saveButton"
        )
        .textContent =
        "💾 Enregistrer les modifications";


    document
        .getElementById(
            "cancelButton"
        )
        .classList
        .remove("hidden");


    toggleApplicationFields();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}

/* ========================= */
/* SUPPRIMER */
/* ========================= */

function deleteAccount(id){

    const account =
        accounts.find(
            a =>
                Number(a.id) ===
                Number(id)
        );


    if(!account){

        return;

    }


    if(!confirm(
        "Supprimer l'accès de " +
        account.personName +
        " ?"
    )){

        return;

    }


    accounts =
        accounts.filter(
            a =>
                Number(a.id) !==
                Number(id)
        );


    saveData();

    renderAccounts();


    showToast(
        "Accès supprimé"
    );

}


/* ========================= */
/* SAUVEGARDE JSON */
/* ========================= */

function downloadBackup(){

    if(accounts.length === 0){

        alert(
            "Il n'y a aucun accès à sauvegarder."
        );

        return;

    }


    const backup = {

        version:5,

        application:
            "Mes accès",

        date:
            new Date()
            .toISOString(),

        accounts:
            accounts

    };


    const blob =
        new Blob(
            [
                JSON.stringify(
                    backup,
                    null,
                    2
                )
            ],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const date =
        new Date()
        .toISOString()
        .slice(0,10);


    link.href =
        url;


    link.download =
        "mes-acces-sauvegarde-" +
        date +
        ".json";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    showToast(
        "Sauvegarde téléchargée 💾"
    );

}


/* ========================= */
/* RESTAURATION */
/* ========================= */

function restoreBackup(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    if(!confirm(
        "⚠️ Restaurer cette sauvegarde ?\n\n" +
        "Les accès actuels seront remplacés."
    )){

        event.target.value =
            "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const data =
                    JSON.parse(
                        e.target.result
                    );


                let restoredAccounts;


                if(Array.isArray(data)){

                    restoredAccounts =
                        data;

                }else if(
                    Array.isArray(
                        data.accounts
                    )
                ){

                    restoredAccounts =
                        data.accounts;

                }else{

                    throw new Error(
                        "Format invalide"
                    );

                }


                accounts =
                    restoredAccounts.map(
                        function(account){

                            return {

                                id:
                                    account.id ||
                                    Date.now() +
                                    Math.random(),

                                personName:
                                    account.personName ||
                                    "",

                                username:
                                    account.username ||
                                    "",

                                password:
                                    account.password ||
                                    "",

                                url1:
                                    account.url1 ||
                                    "",

                                application:
                                    !!account.application,

                                appUrl1:
                                    account.appUrl1 ||
                                    "",

                                mac:
                                    account.mac ||
                                    "",

                                key:
                                    account.key ||
                                    "",

                                photo:
                                    account.photo ||
                                    "",

                                createdAt:
                                    account.createdAt ||
                                    new Date()
                                    .toISOString()

                            };

                        }
                    );


                saveData();

                renderAccounts();

                clearForm();


                showToast(
                    "Sauvegarde restaurée ✅"
                );


            }catch(error){

                alert(
                    "❌ Impossible de restaurer cette sauvegarde."
                );

            }


            event.target.value =
                "";

        };


    reader.readAsText(file);

}


/* ========================= */
/* TOAST */
/* ========================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        function(){

            toast.classList.remove(
                "show"
            );

        },
        1800
    );

}


/* ========================= */
/* SECURITE HTML */
/* ========================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
