<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f2f2f7;
    color:#111;
}

header{
    background:#007aff;
    color:white;
    padding:18px 16px;
    padding-top:calc(18px + env(safe-area-inset-top));
    text-align:center;
    font-size:22px;
    font-weight:700;
    position:sticky;
    top:0;
    z-index:20;
}

.container{
    padding:15px;
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    margin:0 0 15px;
    font-size:20px;
}

label{
    display:block;
    font-weight:600;
    margin:12px 0 6px;
}

input[type="text"],
input[type="password"]{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:10px;
    font-size:16px;
    background:#fff;
}

.inputRow{
    display:flex;
    gap:8px;
}

.inputRow input{
    flex:1;
    min-width:0;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.copyBtn{
    background:#e5e5ea;
    color:#111;
    white-space:nowrap;
}

.primary{
    width:100%;
    background:#007aff;
    color:white;
    margin-top:18px;
    font-size:17px;
}

.cancel{
    width:100%;
    background:#e5e5ea;
    margin-top:8px;
}

.delete{
    background:#ff3b30;
    color:white;
}

.edit{
    background:#ff9500;
    color:white;
}

.show{
    background:#e5e5ea;
    min-width:48px;
}

.applicationBox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
    font-size:17px;
    font-weight:600;
}

.applicationBox input{
    width:22px;
    height:22px;
}

.appFields{
    display:none;
    margin-top:8px;
}

.account{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.accountTitle{
    margin-bottom:15px;
}

.accountName{
    font-size:20px;
    font-weight:700;
    margin-bottom:5px;
}

.appBadge{
    display:inline-block;
    background:#34c759;
    color:white;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.line{
    margin-top:12px;
}

.lineTitle{
    font-size:13px;
    color:#666;
    margin-bottom:4px;
}

.valueRow{
    display:flex;
    gap:8px;
    align-items:center;
}

.value{
    flex:1;
    background:#f2f2f7;
    padding:11px;
    border-radius:9px;
    overflow:hidden;
    word-break:break-all;
    min-height:42px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.actions button{
    flex:1;
}

.search{
    margin-bottom:15px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:12px;
    font-size:16px;
}

.counter{
    color:#666;
    font-size:14px;
    margin-bottom:12px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.hidden{
    display:none !important;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
}

/* =========================
   PIN
========================= */

.pinScreen{
    position:fixed;
    inset:0;
    background:#f2f2f7;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.pinBox{
    width:100%;
    max-width:360px;
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

.pinLogo{
    font-size:45px;
    margin-bottom:10px;
}

.pinBox h1{
    margin:0 0 8px;
    font-size:25px;
}

.pinBox p{
    color:#777;
    margin-bottom:20px;
}

.pinInput{
    width:100%;
    padding:15px;
    border:1px solid #d1d1d6;
    border-radius:12px;
    font-size:25px;
    text-align:center;
    letter-spacing:8px;
}

.pinButton{
    width:100%;
    margin-top:15px;
    background:#007aff;
    color:white;
    font-size:17px;
}

.pinError{
    color:#ff3b30;
    margin-top:12px;
    min-height:20px;
    font-weight:600;
}

/* =========================
   SAUVEGARDE
========================= */

.backupButtons{
    display:flex;
    gap:8px;
}

.backupButtons button{
    flex:1;
}

.backup{
    background:#34c759;
    color:white;
}

.restore{
    background:#5856d6;
    color:white;
}

#restoreFile{
    display:none;
}

.sectionTitle{
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid #e5e5ea;
    font-size:16px;
    font-weight:700;
}

@media(max-width:500px){

    .actions{
        flex-direction:column;
    }

    .backupButtons{
        flex-direction:column;
    }

    .inputRow{
        flex-direction:row;
    }

    .copyBtn{
        padding-left:10px;
        padding-right:10px;
    }
}
</style>
</head>

<body>

<!-- =========================
     ECRAN PIN
========================= -->

<div class="pinScreen" id="pinScreen">

    <div class="pinBox">

        <div class="pinLogo">🔐</div>

        <h1>Mes accès</h1>

        <p>Entrez votre code pour continuer</p>

        <input
            type="password"
            id="pinInput"
            class="pinInput"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
        >

        <button
            class="pinButton"
            onclick="checkPin()"
        >
            🔓 Ouvrir
        </button>

        <div
            class="pinError"
            id="pinError"
        ></div>

    </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden">

<header>
    🔐 Mes accès
</header>

<div class="container">


    <!-- =========================
         FORMULAIRE
    ========================= -->

    <div class="card">

        <h2 id="formTitle">
            ➕ Ajouter un accès
        </h2>


        <!-- URL PRINCIPALES -->

        <label>
            🌐 URL 1
        </label>

        <div class="inputRow">

            <input
                type="text"
                id="url1"
                autocomplete="off"
                placeholder="https://..."
            >

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('url1')"
            >
                📋
            </button>

        </div>


        <label>
            🌐 URL 2
        </label>

        <div class="inputRow">

            <input
                type="text"
                id="url2"
                autocomplete="off"
                placeholder="https://..."
            >

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('url2')"
            >
                📋
            </button>

        </div>


        <!-- NOM -->

        <label>
            👤 Nom / Prénom
        </label>

        <div class="inputRow">

            <input
                type="text"
                id="personName"
                autocomplete="off"
                placeholder="Nom et prénom"
            >

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('personName')"
            >
                📋
            </button>

        </div>


        <!-- UTILISATEUR -->

        <label>
            👤 Utilisateur
        </label>

        <div class="inputRow">

            <input
                type="text"
                id="username"
                autocomplete="off"
                placeholder="Utilisateur"
            >

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('username')"
            >
                📋
            </button>

        </div>


        <!-- MOT DE PASSE -->

        <label>
            🔑 Mot de passe
        </label>

        <div class="inputRow">

            <input
                type="password"
                id="password"
                autocomplete="off"
                placeholder="Mot de passe"
            >

            <button
                class="show"
                type="button"
                onclick="togglePasswordInput(this)"
            >
                👁️
            </button>

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('password')"
            >
                📋
            </button>

        </div>


        <!-- APPLICATION -->

        <div class="applicationBox">

            <input
                type="checkbox"
                id="application"
                onchange="toggleApplicationFields()"
            >

            <span>
                📱 Application
            </span>

        </div>


        <!-- =========================
             CHAMPS APPLICATION
        ========================= -->

        <div
            id="appFields"
            class="appFields"
        >

            <div class="sectionTitle">
                📱 Informations application
            </div>


            <!-- URL APPLICATION 1 -->

            <label>
                🌐 URL 1
            </label>

            <div class="inputRow">

                <input
                    type="text"
                    id="appUrl1"
                    autocomplete="off"
                    placeholder="URL de l'application"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('appUrl1')"
                >
                    📋
                </button>

            </div>


            <!-- URL APPLICATION 2 -->

            <label>
                🌐 URL 2
            </label>

            <div class="inputRow">

                <input
                    type="text"
                    id="appUrl2"
                    autocomplete="off"
                    placeholder="URL de l'application"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('appUrl2')"
                >
                    📋
                </button>

            </div>


            <!-- MAC -->

            <label>
                MAC :
            </label>

            <div class="inputRow">

                <input
                    type="text"
                    id="mac"
                    autocomplete="off"
                    placeholder="Adresse MAC"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('mac')"
                >
                    📋
                </button>

            </div>


            <!-- CLE -->

            <label>
                Clé :
            </label>

            <div class="inputRow">

                <input
                    type="text"
                    id="key"
                    autocomplete="off"
                    placeholder="Clé"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('key')"
                >
                    📋
                </button>

            </div>

        </div>


        <button
            class="primary"
            id="saveButton"
            type="button"
            onclick="saveAccount()"
        >
            💾 Enregistrer
        </button>


        <button
            class="cancel hidden"
            id="cancelButton"
            type="button"
            onclick="cancelEdit()"
        >
            Annuler
        </button>

    </div>


    <!-- =========================
         SAUVEGARDE
    ========================= -->

    <div class="card">

        <h2>
            💾 Sauvegarde
        </h2>

        <p style="color:#666;font-size:14px;">
            Télécharge une copie de tes accès pour pouvoir les restaurer
            en cas de problème ou de changement d'iPhone.
        </p>

        <div class="backupButtons">

            <button
                class="backup"
                onclick="downloadBackup()"
            >
                💾 Télécharger
            </button>

            <button
                class="restore"
                onclick="document.getElementById('restoreFile').click()"
            >
                📥 Restaurer
            </button>

        </div>

        <input
            type="file"
            id="restoreFile"
            accept=".json,application/json"
            onchange="restoreBackup(event)"
        >

    </div>


    <!-- =========================
         RECHERCHE
    ========================= -->

    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="🔎 Rechercher..."
            oninput="renderAccounts()"
        >

    </div>


    <div
        class="counter"
        id="counter"
    ></div>


    <div id="accounts"></div>

</div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

const PIN = "1157";

const STORAGE_KEY = "mesAcces";

let accounts = [];

let editingId = null;


/* =========================
   PIN
========================= */

function checkPin(){

    const value =
        document.getElementById("pinInput").value;

    const error =
        document.getElementById("pinError");


    if(value === PIN){

        document.getElementById("pinScreen")
            .classList.add("hidden");

        document.getElementById("app")
            .classList.remove("hidden");

        error.textContent = "";

        loadAccounts();

    }else{

        error.textContent =
            "Code incorrect";

        document.getElementById("pinInput").value = "";

        document.getElementById("pinInput").focus();

    }

}


document.getElementById("pinInput")
.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

        checkPin();

    }

});


/* =========================
   CHARGEMENT
========================= */

function loadAccounts(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            accounts = JSON.parse(saved);

            if(!Array.isArray(accounts)){

                accounts = [];

            }

        }

    }catch(error){

        accounts = [];

    }

    renderAccounts();

}


/* =========================
   SAUVEGARDE LOCALE
========================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

}


/* =========================
   APPLICATION
========================= */

function toggleApplicationFields(){

    const
