<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f2f2f7;
    color:#111;
}

header{
    background:#007aff;
    color:white;
    padding:18px 16px;
    padding-top:calc(18px + env(safe-area-inset-top));
    text-align:center;
    font-size:22px;
    font-weight:700;
    position:sticky;
    top:0;
    z-index:20;
}

.container{
    padding:15px;
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    margin:0 0 15px;
    font-size:20px;
}

label{
    display:block;
    font-weight:600;
    margin:12px 0 6px;
}

input[type="text"],
input[type="password"]{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:10px;
    font-size:16px;
    background:#fff;
}

.inputRow{
    display:flex;
    gap:8px;
}

.inputRow input{
    flex:1;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.copyBtn{
    background:#e5e5ea;
    color:#111;
    white-space:nowrap;
}

.primary{
    width:100%;
    background:#007aff;
    color:white;
    margin-top:18px;
    font-size:17px;
}

.cancel{
    width:100%;
    background:#e5e5ea;
    margin-top:8px;
}

.delete{
    background:#ff3b30;
    color:white;
}

.edit{
    background:#ff9500;
    color:white;
}

.show{
    background:#e5e5ea;
    min-width:48px;
}

.applicationBox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
    font-size:17px;
    font-weight:600;
}

.applicationBox input{
    width:22px;
    height:22px;
}

.appFields{
    display:none;
    margin-top:8px;
}

.account{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.accountTitle{
    margin-bottom:15px;
}

.accountName{
    font-size:20px;
    font-weight:700;
    margin-bottom:5px;
}

.appBadge{
    display:inline-block;
    background:#34c759;
    color:white;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.line{
    margin-top:12px;
}

.lineTitle{
    font-size:13px;
    color:#666;
    margin-bottom:4px;
}

.valueRow{
    display:flex;
    gap:8px;
    align-items:center;
}

.value{
    flex:1;
    background:#f2f2f7;
    padding:11px;
    border-radius:9px;
    overflow:hidden;
    word-break:break-all;
    min-height:42px;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.actions button{
    flex:1;
}

.search{
    margin-bottom:15px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:12px;
    font-size:16px;
}

.counter{
    color:#666;
    font-size:14px;
    margin-bottom:12px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.hidden{
    display:none !important;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
}

/* =========================
   PIN
========================= */

.pinScreen{
    position:fixed;
    inset:0;
    background:#f2f2f7;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.pinBox{
    width:100%;
    max-width:360px;
    background:white;
    border-radius:22px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.12);
    text-align:center;
}

.pinLogo{
    font-size:45px;
    margin-bottom:10px;
}

.pinBox h1{
    margin:0 0 8px;
    font-size:25px;
}

.pinBox p{
    color:#777;
    margin-bottom:20px;
}

.pinInput{
    width:100%;
    padding:15px;
    border:1px solid #d1d1d6;
    border-radius:12px;
    font-size:25px;
    text-align:center;
    letter-spacing:8px;
}

.pinButton{
    width:100%;
    margin-top:15px;
    background:#007aff;
    color:white;
    font-size:17px;
}

.pinError{
    color:#ff3b30;
    margin-top:12px;
    min-height:20px;
    font-weight:600;
}

/* =========================
   SAUVEGARDE
========================= */

.backupButtons{
    display:flex;
    gap:8px;
}

.backupButtons button{
    flex:1;
}

.backup{
    background:#34c759;
    color:white;
}

.restore{
    background:#5856d6;
    color:white;
}

#restoreFile{
    display:none;
}

@media(max-width:500px){

    .actions{
        flex-direction:column;
    }

    .backupButtons{
        flex-direction:column;
    }

    .inputRow{
        flex-direction:row;
    }

    .copyBtn{
        padding-left:10px;
        padding-right:10px;
    }
}
</style>
</head>

<body>


<!-- =========================
     ECRAN PIN
========================= -->

<div class="pinScreen" id="pinScreen">

    <div class="pinBox">

        <div class="pinLogo">
            🔐
        </div>

        <h1>
            Mes accès
        </h1>

        <p>
            Entrez votre code pour continuer
        </p>

        <input
            type="password"
            id="pinInput"
            class="pinInput"
            inputmode="numeric"
            maxlength="4"
            placeholder="••••"
        >

        <button
            class="pinButton"
            onclick="checkPin()"
        >
            🔓 Ouvrir
        </button>

        <div
            class="pinError"
            id="pinError"
        ></div>

    </div>

</div>


<!-- =========================
     APPLICATION
========================= -->

<div id="app" class="hidden">

<header>
    🔐 Mes accès
</header>


<div class="container">


    <!-- =========================
         AJOUT
    ========================= -->

    <div class="card">

        <h2 id="formTitle">
            ➕ Ajouter un accès
        </h2>


        <label>
            👤 Nom / Prénom
        </label>

        <div class="inputRow">

            <input
                type="text"
                id="personName"
                autocomplete="off"
                placeholder="Nom et prénom"
            >

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('personName')"
            >
                📋
            </button>

        </div>


        <label>
            👤 Utilisateur
        </label>

        <div class="inputRow">

            <input
                type="text"
                id="username"
                autocomplete="off"
                placeholder="Utilisateur"
            >

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('username')"
            >
                📋
            </button>

        </div>


        <label>
            🔑 Mot de passe
        </label>

        <div class="inputRow">

            <input
                type="password"
                id="password"
                autocomplete="off"
                placeholder="Mot de passe"
            >

            <button
                class="show"
                type="button"
                onclick="togglePasswordInput(this)"
            >
                👁️
            </button>

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('password')"
            >
                📋
            </button>

        </div>


        <!-- APPLICATION -->

        <div class="applicationBox">

            <input
                type="checkbox"
                id="application"
                onchange="toggleApplicationFields()"
            >

            <span>
                📱 Application
            </span>

        </div>


        <!-- MAC + CLE -->

        <div
            id="appFields"
            class="appFields"
        >

            <label>
                MAC :
            </label>

            <div class="inputRow">

                <input
                    type="text"
                    id="mac"
                    autocomplete="off"
                    placeholder="Adresse MAC"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('mac')"
                >
                    📋
                </button>

            </div>


            <label>
                Clé :
            </label>

            <div class="inputRow">

                <input
                    type="text"
                    id="key"
                    autocomplete="off"
                    placeholder="Clé"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('key')"
                >
                    📋
                </button>

            </div>

        </div>


        <button
            class="primary"
            id="saveButton"
            type="button"
            onclick="saveAccount()"
        >
            💾 Enregistrer
        </button>


        <button
            class="cancel hidden"
            id="cancelButton"
            type="button"
            onclick="cancelEdit()"
        >
            Annuler
        </button>

    </div>


    <!-- =========================
         SAUVEGARDE
    ========================= -->

    <div class="card">

        <h2>
            💾 Sauvegarde
        </h2>

        <p style="color:#666;font-size:14px;">
            Télécharge une copie de tes accès pour pouvoir les restaurer
            en cas de problème ou de changement d'iPhone.
        </p>

        <div class="backupButtons">

            <button
                class="backup"
                onclick="downloadBackup()"
            >
                💾 Télécharger
            </button>

            <button
                class="restore"
                onclick="document.getElementById('restoreFile').click()"
            >
                📥 Restaurer
            </button>

        </div>

        <input
            type="file"
            id="restoreFile"
            accept=".json,application/json"
            onchange="restoreBackup(event)"
        >

    </div>


    <!-- =========================
         RECHERCHE
    ========================= -->

    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="🔎 Rechercher un nom, utilisateur, MAC..."
            oninput="renderAccounts()"
        >

    </div>


    <div
        class="counter"
        id="counter"
    ></div>


    <div id="accounts"></div>


</div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================
   CONFIGURATION
========================= */

const PIN = "1157";

const STORAGE_KEY = "mesAcces";

let accounts = [];

let editingId = null;


/* =========================
   PIN
========================= */

function checkPin(){

    const value =
        document.getElementById("pinInput").value;

    const error =
        document.getElementById("pinError");


    if(value === PIN){

        document.getElementById("pinScreen")
            .classList.add("hidden");

        document.getElementById("app")
            .classList.remove("hidden");

        error.textContent = "";

        loadAccounts();

    }else{

        error.textContent =
            "Code incorrect";

        document.getElementById("pinInput").value = "";

        document.getElementById("pinInput").focus();

    }

}


/* Entrée clavier */

document.getElementById("pinInput")
    .addEventListener("keydown", function(event){

        if(event.key === "Enter"){

            checkPin();

        }

    });


/* =========================
   CHARGEMENT
========================= */

function loadAccounts(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            accounts = JSON.parse(saved);

            if(!Array.isArray(accounts)){

                accounts = [];

            }

        }

    }catch(error){

        accounts = [];

    }

    renderAccounts();

}


/* =========================
   SAUVEGARDE LOCALE
========================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

}


/* =========================
   APPLICATION
========================= */

function toggleApplicationFields(){

    const checkbox =
        document.getElementById("application");

    const fields =
        document.getElementById("appFields");


    if(checkbox.checked){

        fields.style.display = "block";

    }else{

        fields.style.display = "none";

    }

}


/* =========================
   MOT DE PASSE
========================= */

function togglePasswordInput(button){

    const input =
        document.getElementById("password");


    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* =========================
   COPIER INPUT
========================= */

async function copyInput(id){

    const input =
        document.getElementById(id);

    const value =
        input.value;


    if(!value){

        showToast("Rien à copier");

        return;

    }


    await copyText(value);

}


/* =========================
   COPIER VALEUR
========================= */

async function copyValue(value){

    if(!value){

        showToast("Rien à copier");

        return;

    }


    await copyText(value);

}


/* =========================
   COPIE
========================= */

async function copyText(value){

    try{

        await navigator.clipboard.writeText(value);

        showToast("Copié 📋");

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = value;

        textarea.style.position = "fixed";

        textarea.style.opacity = "0";

        document.body.appendChild(textarea);

        textarea.focus();

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        showToast("Copié 📋");

    }

}


/* =========================
   ENREGISTRER
========================= */

function saveAccount(){

    const personName =
        document.getElementById("personName")
        .value
        .trim();


    const username =
        document.getElementById("username")
        .value
        .trim();


    const password =
        document.getElementById("password")
        .value;


    const application =
        document.getElementById("application")
        .checked;


    const mac =
        document.getElementById("mac")
        .value
        .trim();


    const key =
        document.getElementById("key")
        .value
        .trim();


    if(!personName){

        alert("Veuillez entrer le nom / prénom.");

        return;

    }


    if(!username){

        alert("Veuillez entrer un utilisateur.");

        return;

    }


    if(!password){

        alert("Veuillez entrer un mot de passe.");

        return;

    }


    if(editingId !== null){

        const account =
            accounts.find(
                a => a.id === editingId
            );


        if(account){

            account.personName =
                personName;

            account.username =
                username;

            account.password =
                password;

            account.application =
                application;

            account.mac =
                application ? mac : "";

            account.key =
                application ? key : "";

        }


        showToast("Accès modifié ✅");

    }else{

        const newAccount = {

            id: Date.now(),

            personName:
                personName,

            username:
                username,

            password:
                password,

            application:
                application,

            mac:
                application ? mac : "",

            key:
                application ? key : "",

            createdAt:
                new Date().toISOString()

        };


        accounts.unshift(
            newAccount
        );


        showToast("Accès enregistré ✅");

    }


    saveData();

    clearForm();

    renderAccounts();

}


/* =========================
   AFFICHER LES COMPTES
========================= */

function renderAccounts(){

    const container =
        document.getElementById("accounts");


    const search =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const filtered =
        accounts.filter(account => {

            return (

                (account.personName || "")
                .toLowerCase()
                .includes(search)

                ||

                (account.username || "")
                .toLowerCase()
                .includes(search)

                ||

                (account.mac || "")
                .toLowerCase()
                .includes(search)

                ||

                (account.key || "")
                .toLowerCase()
                .includes(search)

            );

        });


    document.getElementById("counter")
        .textContent =
            filtered.length +
            (
                filtered.length > 1
                ? " accès"
                : " accès"
            );


    container.innerHTML = "";


    if(filtered.length === 0){

        container.innerHTML = `

            <div class="card empty">

                Aucun accès enregistré.

            </div>

        `;

        return;

    }


    filtered.forEach(account => {

        const card =
            document.createElement("div");

        card.className = "account";


        let html = `

            <div class="accountTitle">

                <div class="accountName">

                    👤 ${escapeHtml(
                        account.personName || ""
                    )}

                </div>

                ${
                    account.application
                    ?
                    `<span class="appBadge">
                        📱 APPLICATION
                    </span>`
                    :
                    ""
                }

            </div>


            <div class="line">

                <div class="lineTitle">
                    Utilisateur
                </div>

                <div class="valueRow">

                    <div class="value">

                        ${escapeHtml(
                            account.username || ""
                        )}

                    </div>

                    <button
                        class="copyBtn"
                        onclick="copyValue(
                            ${escapeJs(
                                account.username || ""
                            )}
                        )"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="line">

                <div class="lineTitle">
                    Mot de passe
                </div>

                <div class="valueRow">

                    <div
                        class="value"
                        id="pass-${account.id}"
                    >
                        ••••••••••
                    </div>

                    <button
                        class="show"
                        onclick="showPasswordAccount(
                            ${account.id},
                            this
                        )"
                    >
                        👁️
                    </button>

                    <button
                        class="copyBtn"
                        onclick="copyValue(
                            ${escapeJs(
                                account.password || ""
                            )}
                        )"
                    >
                        📋
                    </button>

                </div>

            </div>

        `;


        if(account.application){

            html += `

                <div class="line">

                    <div class="lineTitle">
                        MAC
                    </div>

                    <div class="valueRow">

                        <div class="value">

                            ${escapeHtml(
                                account.mac || ""
                            )}

                        </div>

                        <button
                            class="copyBtn"
                            onclick="copyValue(
                                ${escapeJs(
                                    account.mac || ""
                                )}
                            )"
                        >
                            📋
                        </button>

                    </div>

                </div>


                <div class="line">

                    <div class="lineTitle">
                        Clé
                    </div>

                    <div class="valueRow">

                        <div class="value">

                            ${escapeHtml(
                                account.key || ""
                            )}

                        </div>

                        <button
                            class="copyBtn"
                            onclick="copyValue(
                                ${escapeJs(
                                    account.key || ""
                                )}
                            )"
                        >
                            📋
                        </button>

                    </div>

                </div>

            `;

        }


        html += `

            <div class="actions">

                <button
                    class="edit"
                    onclick="editAccount(
                        ${account.id}
                    )"
                >
                    ✏️ Modifier
                </button>

                <button
                    class="delete"
                    onclick="deleteAccount(
                        ${account.id}
                    )"
                >
                    🗑️ Supprimer
                </button>

            </div>

        `;


        card.innerHTML = html;

        container.appendChild(card);

    });

}


/* =========================
   AFFICHER MOT DE PASSE
========================= */

function showPasswordAccount(
    id,
    button
){

    const account =
        accounts.find(
            a => a.id === id
        );


    if(!account) return;


    const element =
        document.getElementById(
            "pass-" + id
        );


    if(
        element.dataset.visible ===
        "true"
    ){

        element.textContent =
            "••••••••••";

        element.dataset.visible =
            "false";

        button.textContent =
            "👁️";

    }else{

        element.textContent =
            account.password;

        element.dataset.visible =
            "true";

        button.textContent =
            "🙈";

    }

}


/* =========================
   MODIFIER
========================= */

function editAccount(id){

    const account =
        accounts.find(
            a => a.id === id
        );


    if(!account) return;


    editingId = id;


    document.getElementById(
        "personName"
    ).value =
        account.personName || "";


    document.getElementById(
        "username"
    ).value =
        account.username || "";


    document.getElementById(
        "password"
    ).value =
        account.password || "";


    document.getElementById(
        "application"
    ).checked =
        !!account.application;


    document.getElementById(
        "mac"
    ).value =
        account.mac || "";


    document.getElementById(
        "key"
    ).value =
        account.key || "";


    document.getElementById(
        "saveButton"
    ).textContent =
        "💾 Enregistrer les modifications";


    document.getElementById(
        "cancelButton"
    ).classList.remove(
        "hidden"
    );


    toggleApplicationFields();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

}


/* =========================
   ANNULER
========================= */

function cancelEdit(){

    editingId = null;

    clearForm();

}


/* =========================
   VIDER
========================= */

function clearForm(){

    editingId = null;


    document.getElementById(
        "personName"
    ).value = "";


    document.getElementById(
        "username"
    ).value = "";


    document.getElementById(
        "password"
    ).value = "";


    document.getElementById(
        "application"
    ).checked = false;


    document.getElementById(
        "mac"
    ).value = "";


    document.getElementById(
        "key"
    ).value = "";


    document.getElementById(
        "password"
    ).type =
        "password";


    document.getElementById(
        "saveButton"
    ).textContent =
        "💾 Enregistrer";


    document.getElementById(
        "cancelButton"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        "appFields"
    ).style.display =
        "none";

}


/* =========================
   SUPPRIMER
========================= */

function deleteAccount(id){

    const account =
        accounts.find(
            a => a.id === id
        );


    if(!account) return;


    const confirmation =
        confirm(
            "Supprimer l'accès de " +
            account.personName +
            " ?"
        );


    if(!confirmation) return;


    accounts =
        accounts.filter(
            a => a.id !== id
        );


    saveData();

    renderAccounts();

    showToast(
        "Accès supprimé"
    );

}


/* =========================
   TELECHARGER SAUVEGARDE
========================= */

function downloadBackup(){

    if(accounts.length === 0){

        alert(
            "Il n'y a aucun accès à sauvegarder."
        );

        return;

    }


    const backup = {

        version: 1,

        application: "Mes accès",

        date:
            new Date().toISOString(),

        accounts:
            accounts

    };


    const json =
        JSON.stringify(
            backup,
            null,
            2
        );


    const blob =
        new Blob(
            [json],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    const date =
        new Date()
        .toISOString()
        .slice(0,10);


    link.href = url;

    link.download =
        "mes-acces-sauvegarde-" +
        date +
        ".json";


    document.body.appendChild(link);

    link.click();

    link.remove();


    URL.revokeObjectURL(url);


    showToast(
        "Sauvegarde téléchargée 💾"
    );

}


/* =========================
   RESTAURER
========================= */

function restoreBackup(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const confirmation =
        confirm(
            "⚠️ Restaurer cette sauvegarde ?\n\n" +
            "Les accès actuellement présents " +
            "seront remplacés par ceux de la sauvegarde."
        );


    if(!confirmation){

        event.target.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            try{

                const data =
                    JSON.parse(
                        e.target.result
                    );


                let restoredAccounts;


                if(
                    Array.isArray(data)
                ){

                    restoredAccounts =
                        data;

                }else if(
                    Array.isArray(
                        data.accounts
                    )
                ){

                    restoredAccounts =
                        data.accounts;

                }else{

                    throw new Error(
                        "Format invalide"
                    );

                }


                restoredAccounts =
                    restoredAccounts
                    .map(account => ({

                        id:
                            account.id ||
                            Date.now() +
                            Math.random(),

                        personName:
                            account.personName ||
                            "",

                        username:
                            account.username ||
                            "",

                        password:
                            account.password ||
                            "",

                        application:
                            !!account.application,

                        mac:
                            account.mac ||
                            "",

                        key:
                            account.key ||
                            "",

                        createdAt:
                            account.createdAt ||
                            new Date().toISOString()

                    }));


                accounts =
                    restoredAccounts;


                saveData();

                renderAccounts();

                clearForm();


                showToast(
                    "Sauvegarde restaurée ✅"
                );


            }catch(error){

                alert(
                    "❌ Impossible de restaurer cette sauvegarde.\n\n" +
                    "Le fichier n'est pas valide."
                );

            }


            event.target.value = "";

        };


    reader.readAsText(file);

}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        1800
    );

}


/* =========================
   SECURITE HTML
========================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeJs(value){

    return JSON.stringify(
        String(value)
    );

}
