<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mes accès</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f2f2f7;
    color:#111;
}

header{
    background:#007aff;
    color:white;
    padding:18px 16px;
    padding-top:calc(18px + env(safe-area-inset-top));
    text-align:center;
    font-size:22px;
    font-weight:700;
    position:sticky;
    top:0;
    z-index:20;
}

.container{
    padding:15px;
    max-width:700px;
    margin:auto;
}

.card{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

h2{
    margin:0 0 15px;
    font-size:20px;
}

label{
    display:block;
    font-weight:600;
    margin:12px 0 6px;
}

input[type="text"],
input[type="password"]{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:10px;
    font-size:16px;
    background:#fff;
}

.inputRow{
    display:flex;
    gap:8px;
}

.inputRow input{
    flex:1;
}

button{
    border:0;
    border-radius:10px;
    padding:12px 14px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
}

.copyBtn{
    background:#e5e5ea;
    color:#111;
    white-space:nowrap;
}

.primary{
    width:100%;
    background:#007aff;
    color:white;
    margin-top:18px;
    font-size:17px;
}

.cancel{
    width:100%;
    background:#e5e5ea;
    margin-top:8px;
}

.delete{
    background:#ff3b30;
    color:white;
}

.edit{
    background:#ff9500;
    color:white;
}

.show{
    background:#e5e5ea;
    min-width:48px;
}

.applicationBox{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
    font-size:17px;
    font-weight:600;
}

.applicationBox input{
    width:22px;
    height:22px;
}

.appFields{
    display:none;
    margin-top:8px;
}

.account{
    background:white;
    border-radius:16px;
    padding:16px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.accountTitle{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
}

.accountTitle strong{
    font-size:18px;
}

.badge{
    background:#34c759;
    color:white;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:700;
}

.line{
    margin-top:10px;
}

.lineTitle{
    font-size:13px;
    color:#666;
    margin-bottom:4px;
}

.valueRow{
    display:flex;
    gap:8px;
    align-items:center;
}

.value{
    flex:1;
    background:#f2f2f7;
    padding:11px;
    border-radius:9px;
    overflow:hidden;
    word-break:break-all;
}

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.actions button{
    flex:1;
}

.search{
    margin-bottom:15px;
}

.search input{
    width:100%;
    padding:13px;
    border:1px solid #d1d1d6;
    border-radius:12px;
    font-size:16px;
}

.empty{
    text-align:center;
    color:#777;
    padding:30px 10px;
}

.hidden{
    display:none !important;
}

.counter{
    color:#666;
    font-size:14px;
    margin-top:-8px;
    margin-bottom:15px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);
    background:#222;
    color:white;
    padding:12px 18px;
    border-radius:25px;
    font-size:14px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:100;
}

.toast.show{
    opacity:1;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
}

.modalContent{
    width:100%;
    max-width:700px;
    background:#f2f2f7;
    border-radius:20px 20px 0 0;
    padding:20px;
    padding-bottom:calc(20px + env(safe-area-inset-bottom));
    max-height:90vh;
    overflow:auto;
}

.modalHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.close{
    background:#e5e5ea;
    border-radius:50%;
    width:38px;
    height:38px;
    padding:0;
    font-size:20px;
}

@media(max-width:500px){
    .actions{
        flex-direction:column;
    }

    .inputRow{
        flex-direction:row;
    }

    .copyBtn{
        padding-left:10px;
        padding-right:10px;
    }
}
</style>
</head>

<body>

<header>
    🔐 Mes accès
</header>

<div class="container">

    <div class="card">

        <h2 id="formTitle">➕ Ajouter un accès</h2>

        <label>👤 Utilisateur</label>

        <div class="inputRow">
            <input
                type="text"
                id="username"
                autocomplete="off"
                placeholder="Utilisateur"
            >

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('username')"
            >
                📋
            </button>
        </div>


        <label>🔑 Mot de passe</label>

        <div class="inputRow">
            <input
                type="password"
                id="password"
                autocomplete="off"
                placeholder="Mot de passe"
            >

            <button
                class="show"
                type="button"
                onclick="togglePassword()"
            >
                👁️
            </button>

            <button
                class="copyBtn"
                type="button"
                onclick="copyInput('password')"
            >
                📋
            </button>
        </div>


        <div class="applicationBox">

            <input
                type="checkbox"
                id="application"
                onchange="toggleApplicationFields()"
            >

            <span>📱 Application</span>

        </div>


        <div id="appFields" class="appFields">

            <label>MAC :</label>

            <div class="inputRow">
                <input
                    type="text"
                    id="mac"
                    autocomplete="off"
                    placeholder="Adresse MAC"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('mac')"
                >
                    📋
                </button>
            </div>


            <label>Clé :</label>

            <div class="inputRow">
                <input
                    type="text"
                    id="key"
                    autocomplete="off"
                    placeholder="Clé"
                >

                <button
                    class="copyBtn"
                    type="button"
                    onclick="copyInput('key')"
                >
                    📋
                </button>
            </div>

        </div>


        <button
            class="primary"
            id="saveButton"
            type="button"
            onclick="saveAccount()"
        >
            💾 Enregistrer
        </button>

        <button
            class="cancel hidden"
            id="cancelButton"
            type="button"
            onclick="cancelEdit()"
        >
            Annuler
        </button>

    </div>


    <div class="search">

        <input
            type="text"
            id="search"
            placeholder="🔎 Rechercher..."
            oninput="renderAccounts()"
        >

    </div>

    <div class="counter" id="counter"></div>

    <div id="accounts"></div>

</div>


<div class="toast" id="toast"></div>


<script>

const STORAGE_KEY = "mesAcces";

let accounts = [];

let editingId = null;


/* =========================
   CHARGEMENT
========================= */

function loadAccounts(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(saved){

            accounts = JSON.parse(saved);

            if(!Array.isArray(accounts)){
                accounts = [];
            }

        }

    }catch(error){

        accounts = [];

    }

    renderAccounts();

}


/* =========================
   SAUVEGARDE
========================= */

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(accounts)
    );

}


/* =========================
   APPLICATION
========================= */

function toggleApplicationFields(){

    const checkbox =
        document.getElementById("application");

    const fields =
        document.getElementById("appFields");

    if(checkbox.checked){

        fields.style.display = "block";

    }else{

        fields.style.display = "none";

    }

}


/* =========================
   MOT DE PASSE
========================= */

function togglePassword(){

    const input =
        document.getElementById("password");

    const button =
        event.currentTarget;

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "🙈";

    }else{

        input.type = "password";

        button.textContent = "👁️";

    }

}


/* =========================
   COPIER UN CHAMP
========================= */

async function copyInput(id){

    const input =
        document.getElementById(id);

    const value =
        input.value;

    if(!value){

        showToast("Rien à copier");

        return;

    }

    try{

        await navigator.clipboard.writeText(value);

        showToast("Copié 📋");

    }catch(error){

        input.select();

        document.execCommand("copy");

        showToast("Copié 📋");

    }

}


/* =========================
   COPIER UNE VALEUR
========================= */

async function copyValue(value){

    if(!value){

        showToast("Rien à copier");

        return;

    }

    try{

        await navigator.clipboard.writeText(value);

        showToast("Copié 📋");

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = value;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

        showToast("Copié 📋");

    }

}


/* =========================
   ENREGISTRER
========================= */

function saveAccount(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const application =
        document.getElementById("application").checked;

    const mac =
        document.getElementById("mac").value.trim();

    const key =
        document.getElementById("key").value.trim();


    if(!username){

        alert("Veuillez entrer un utilisateur.");

        return;

    }


    if(!password){

        alert("Veuillez entrer un mot de passe.");

        return;

    }


    if(editingId !== null){

        const account =
            accounts.find(a => a.id === editingId);

        if(account){

            account.username = username;
            account.password = password;
            account.application = application;
            account.mac = application ? mac : "";
            account.key = application ? key : "";

        }

        showToast("Accès modifié ✅");

    }else{

        const newAccount = {

            id: Date.now(),

            username: username,

            password: password,

            application: application,

            mac: application ? mac : "",

            key: application ? key : "",

            createdAt: new Date().toISOString()

        };

        accounts.unshift(newAccount);

        showToast("Accès enregistré ✅");

    }


    saveData();

    clearForm();

    renderAccounts();

}


/* =========================
   AFFICHER LES ACCÈS
========================= */

function renderAccounts(){

    const container =
        document.getElementById("accounts");

    const search =
        document.getElementById("search").value
        .trim()
        .toLowerCase();


    let filtered =
        accounts.filter(account => {

            return (

                account.username.toLowerCase().includes(search)

                ||

                (account.mac || "")
                .toLowerCase()
                .includes(search)

                ||

                (account.key || "")
                .toLowerCase()
                .includes(search)

            );

        });


    document.getElementById("counter").textContent =
        filtered.length +
        (filtered.length > 1
            ? " accès"
            : " accès");


    container.innerHTML = "";


    if(filtered.length === 0){

        container.innerHTML = `
            <div class="card empty">
                Aucun accès enregistré.
            </div>
        `;

        return;

    }


    filtered.forEach(account => {

        const card =
            document.createElement("div");

        card.className = "account";


        let html = `

            <div class="accountTitle">

                <strong>
                    👤 ${escapeHtml(account.username)}
                </strong>

                ${
                    account.application
                    ? `<span class="badge">APPLICATION</span>`
                    : ""
                }

            </div>


            <div class="line">

                <div class="lineTitle">
                    Utilisateur
                </div>

                <div class="valueRow">

                    <div class="value">
                        ${escapeHtml(account.username)}
                    </div>

                    <button
                        class="copyBtn"
                        onclick="copyValue(${escapeJs(account.username)})"
                    >
                        📋
                    </button>

                </div>

            </div>


            <div class="line">

                <div class="lineTitle">
                    Mot de passe
                </div>

                <div class="valueRow">

                    <div
                        class="value"
                        id="pass-${account.id}"
                    >
                        ••••••••••
                    </div>

                    <button
                        class="show"
                        onclick="showPasswordAccount(${account.id}, this)"
                    >
                        👁️
                    </button>

                    <button
                        class="copyBtn"
                        onclick="copyValue(${escapeJs(account.password)})"
                    >
                        📋
                    </button>

                </div>

            </div>

        `;


        if(account.application){

            html += `

                <div class="line">

                    <div class="lineTitle">
                        MAC
                    </div>

                    <div class="valueRow">

                        <div class="value">
                            ${escapeHtml(account.mac || "")}
                        </div>

                        <button
                            class="copyBtn"
                            onclick="copyValue(${escapeJs(account.mac || "")})"
                        >
                            📋
                        </button>

                    </div>

                </div>


                <div class="line">

                    <div class="lineTitle">
                        Clé
                    </div>

                    <div class="valueRow">

                        <div class="value">
                            ${escapeHtml(account.key || "")}
                        </div>

                        <button
                            class="copyBtn"
                            onclick="copyValue(${escapeJs(account.key || "")})"
                        >
                            📋
                        </button>

                    </div>

                </div>

            `;

        }


        html += `

            <div class="actions">

                <button
                    class="edit"
                    onclick="editAccount(${account.id})"
                >
                    ✏️ Modifier
                </button>

                <button
                    class="delete"
                    onclick="deleteAccount(${account.id})"
                >
                    🗑️ Supprimer
                </button>

            </div>

        `;


        card.innerHTML = html;

        container.appendChild(card);

    });

}


/* =========================
   AFFICHER MOT DE PASSE
========================= */

function showPasswordAccount(id, button){

    const account =
        accounts.find(a => a.id === id);

    if(!account) return;


    const element =
        document.getElementById("pass-" + id);


    if(element.dataset.visible === "true"){

        element.textContent = "••••••••••";

        element.dataset.visible = "false";

        button.textContent = "👁️";

    }else{

        element.textContent = account.password;

        element.dataset.visible = "true";

        button.textContent = "🙈";

    }

}


/* =========================
   MODIFIER
========================= */

function editAccount(id){

    const account =
        accounts.find(a => a.id === id);

    if(!account) return;


    editingId = id;


    document.getElementById("username").value =
        account.username;

    document.getElementById("password").value =
        account.password;

    document.getElementById("application").checked =
        account.application;

    document.getElementById("mac").value =
        account.mac || "";

    document.getElementById("key").value =
        account.key || "";


    document.getElementById("saveButton").textContent =
        "💾 Enregistrer les modifications";

    document.getElementById("cancelButton")
        .classList.remove("hidden");


    toggleApplicationFields();


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   ANNULER MODIFICATION
========================= */

function cancelEdit(){

    editingId = null;

    clearForm();

}


/* =========================
   VIDER FORMULAIRE
========================= */

function clearForm(){

    editingId = null;


    document.getElementById("username").value = "";

    document.getElementById("password").value = "";

    document.getElementById("application").checked = false;

    document.getElementById("mac").value = "";

    document.getElementById("key").value = "";


    document.getElementById("password").type =
        "password";


    document.getElementById("saveButton").textContent =
        "💾 Enregistrer";


    document.getElementById("cancelButton")
        .classList.add("hidden");


    document.getElementById("appFields").style.display =
        "none";

}


/* =========================
   SUPPRIMER
========================= */

function deleteAccount(id){

    const account =
        accounts.find(a => a.id === id);

    if(!account) return;


    const confirmation =
        confirm(
            "Supprimer l'accès de " +
            account.username +
            " ?"
        );


    if(!confirmation) return;


    accounts =
        accounts.filter(a => a.id !== id);


    saveData();

    renderAccounts();

    showToast("Accès supprimé");

}


/* =========================
   TOAST
========================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.textContent = message;

    toast.classList.add("show");


    setTimeout(() => {

        toast.classList.remove("show");

    }, 1800);

}


/* =========================
   SECURITE HTML
========================= */

function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeJs(value){

    return JSON.stringify(String(value));

}


/* =========================
   DEMARRAGE
========================= */

loadAccounts();

</script>

</body>
</html>
